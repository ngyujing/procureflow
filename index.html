/* ── iOS / Mobile ── */
@media (max-width: 768px) {
  body { overflow: hidden; }
  /* Safe area helpers */
  .safe-top    { padding-top:    env(safe-area-inset-top, 0px);    }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* Hide desktop sidebar on mobile */
  .desktop-sidebar { display: none !important; }

  /* Mobile header */
  .mobile-header {
    display: flex !important;
    position: sticky; top: 0; z-index: 100;
    padding-top: env(safe-area-inset-top, 0px);
  }
  .desktop-header { display: none !important; }

  /* Main content gets bottom padding for nav bar */
  .main-scroll {
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)) !important;
  }

  /* Bottom nav bar */
  .bottom-nav {
    display: flex !important;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Stat grids: 2 cols on mobile */
  .stat-grid-4 { grid-template-columns: repeat(2,1fr) !important; }
  .stat-grid-3 { grid-template-columns: repeat(2,1fr) !important; }

  /* Charts: single col */
  .chart-row   { grid-template-columns: 1fr !important; }

  /* Project cards: single col */
  .proj-grid   { grid-template-columns: 1fr !important; }

  /* Kanban: horizontal snap scroll */
  .kanban-board {
    display: flex !important;
    flex-direction: row !important;
    overflow-x: auto !important;
    scroll-snap-type: x mandatory !important;
    -webkit-overflow-scrolling: touch !important;
    gap: 12px !important;
    padding-bottom: 8px !important;
  }
  .kanban-col {
    min-width: 82vw !important;
    max-width: 82vw !important;
    scroll-snap-align: center !important;
    flex-shrink: 0 !important;
  }

  /* Modals: full-screen slide-up */
  .modal-overlay {
    align-items: flex-end !important;
    padding: 0 !important;
  }
  .modal-sheet {
    width: 100% !important;
    max-width: 100% !important;
    max-height: 92vh !important;
    border-radius: 18px 18px 0 0 !important;
    border-bottom: none !important;
    margin-bottom: env(safe-area-inset-bottom, 0px) !important;
  }

  /* Form grids: single col */
  .form-grid-2 { grid-template-columns: 1fr !important; }
  .form-grid-2 > * { grid-column: 1 !important; }

  /* Larger touch targets */
  button { min-height: 36px; }
  .nav-btn { min-height: 44px !important; }

  /* Page padding */
  .page-pad { padding: 14px 16px !important; }

  /* Settings table: hide rate col */
  .cur-rate-col { display: none !important; }

  /* Demo banner: shorter */
  .demo-banner span { font-size: 11px !important; }
  .demo-banner code { display: none !important; }
}

/* Desktop: hide mobile-only elements */
@media (min-width: 769px) {
  .mobile-header { display: none !important; }
  .bottom-nav    { display: none !important; }
}

function mpRatesMap(manpowerTypes) {

/* Normalize any date value to YYYY-MM-DD for <input type="date"> + calcDays.
   Supabase may return a full ISO timestamp which date inputs cannot display. */
function dOnly(s){ return s ? String(s).slice(0,10) : ''; }
/* Clamp FTE to the 0–1 range */
function clampFte(v){ var n=parseFloat(v); if(isNaN(n))return 0; return Math.max(0,Math.min(1,n)); }

function calcDays(s, e) {
  if (!s || !e) return 0;
  var sd = new Date(dOnly(s)), ed = new Date(dOnly(e));
  if (isNaN(sd)||isNaN(ed)||ed<sd) return 0;
  return Math.round((ed - sd) / 86400000) + 1;
}
function mpEstCostForProject(manpower, projectId, ratesMap) {
  var rm = ratesMap || {};
  return manpower.filter(function(m){return m.projectId===projectId;}).reduce(function(s,m){
    return s + (m.est_hours||0)*(m.qty||1)*(m.fte||1)*(rm[m.manpower_type]||0);
  }, 0);
}
function mpActCostForProject(manpower, projectId, ratesMap) {
  var rm = ratesMap || {};
  return manpower.filter(function(m){return m.projectId===projectId;}).reduce(function(s,m){
    return s + (m.act_hours||0)*(m.qty||1)*(m.fte||1)*(rm[m.manpower_type]||0);
  }, 0);
}
function isCommitted(status) { return ['Order','Received','Delivered'].indexOf(status)>=0; }
function procEstForProject(items, projectId) {
  return items.filter(function(i){return i.projectId===projectId;}).reduce(function(s,i){return s+(i.cost||0);},0);
}
function procCommittedForProject(items, projectId) {
  return items.filter(function(i){return i.projectId===projectId&&isCommitted(i.status);})
    .reduce(function(s,i){return s+(i.act_cost!=null?i.act_cost:i.cost);},0);
}
function buildSCurveData(items) {
  var allDates=items.map(function(i){return i.delivery_date||i.order_by_date;}).filter(Boolean);
  if(!allDates.length)return[];
  var minM=allDates.reduce(function(a,b){return a<b?a:b;}).slice(0,7);
  var maxM=allDates.reduce(function(a,b){return a>b?a:b;}).slice(0,7);
  var months=[],cur=new Date(minM+'-01'),end=new Date(maxM+'-01');
  while(cur<=end){months.push(cur.toISOString().slice(0,7));cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}
  var planByM={},actByM={};
  items.forEach(function(i){if(i.delivery_date){var m=i.delivery_date.slice(0,7);planByM[m]=(planByM[m]||0)+(i.cost||0);}});
  items.filter(function(i){return isCommitted(i.status)&&i.order_by_date;}).forEach(function(i){
    var m=i.order_by_date.slice(0,7),c=i.act_cost!=null?i.act_cost:i.cost;actByM[m]=(actByM[m]||0)+c;
  });
  var cumP=0,cumA=0;
  return months.map(function(m){
    cumP+=(planByM[m]||0);cumA+=(actByM[m]||0);
    var d=new Date(m+'-01');
    return{label:d.toLocaleDateString('en-US',{month:'short'}),planned:cumP,actual:cumA};
  });
}
function buildEACData(projects,items,manpower,manpowerTypes) {
  var rm=mpRatesMap(manpowerTypes||DEMO_MANPOWER_TYPES);
  return projects.map(function(p){
    var pi=items.filter(function(i){return i.projectId===p.id;});
    var procComm=procCommittedForProject(items,p.id);
    var procRemEst=pi.filter(function(i){return!isCommitted(i.status);}).reduce(function(s,i){return s+(i.cost||0);},0);
    var procEAC=procComm+procRemEst;
    var mpEst=mpEstCostForProject(manpower,p.id,rm);
    var mpAct=mpActCostForProject(manpower,p.id,rm);
    var mpEAC=mpAct>0?mpAct:mpEst;
    var totalBudget=(p.budget||0)+(p.manpower_budget||0);
    var totalEAC=procEAC+mpEAC;
    return{id:p.id,name:p.name,color:p.color,procBudget:p.budget||0,procComm:procComm,mpBudget:p.manpower_budget||0,mpEAC:mpEAC,totalBudget:totalBudget,totalEAC:totalEAC,variance:totalBudget-totalEAC,overrun:totalEAC>totalBudget};
  });
}
function buildCashFlowData(items) {
  var byM={};
  items.forEach(function(i){
    if(!i.delivery_date)return;
    var m=i.delivery_date.slice(0,7);
    if(!byM[m])byM[m]={month:m,planned:0,committed:0};
    byM[m].planned+=(i.cost||0);
    if(isCommitted(i.status))byM[m].committed+=(i.act_cost!=null?i.act_cost:i.cost);
  });
  return Object.keys(byM).sort().map(function(m){return byM[m];});
}

function toDBM(d)  { var r = Object.assign({}, d, {project_id: d.projectId}); delete r.projectId; return r; }
function initials(email, name) {
  if (name && name.trim()) {
    var parts = name.trim().split(' ');
    return parts.length > 1 ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase() : parts[0].slice(0,2).toUpperCase();
  }
  return email ? email[0].toUpperCase() : '?';
}
function shortDate(ts) {
  if (!ts) return '—';
  var d = new Date(ts);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}
function calcOrderBy(deliveryDate, leadDays) {
  if (!deliveryDate || !leadDays || isNaN(+leadDays)) return '';
  var d = new Date(deliveryDate);
  if (isNaN(d.getTime())) return '';
  d.setDate(d.getDate() - Math.max(0, +leadDays));
  return d.toISOString().split('T')[0];
}
function urgencyLabel(dateStr, status) {
  if (status === 'Received' || status === 'Delivered') {
    return {color:'#34D399', label:'FULFILLED', fulfilled:true};
  }
  if (!dateStr) return {color:'var(--c-text5)', label:'—'};
  var diff = (new Date(dateStr) - new Date()) / 86400000;
  if (diff < 0)  return {color:'#F87171', label:'OVERDUE'};
  if (diff < 7)  return {color:'#EF4444', label:'THIS WEEK'};
  if (diff < 14) return {color:'#F59E0B', label:'URGENT'};
  if (diff < 30) return {color:'#FBBF24', label:'SOON'};
  return {color:'#34D399', label:'ON TRACK'};
}
/* Convert amount between currencies using fetched rates (all relative to USD) */
function convert(amount, fromCode, toCode, rates) {
  if (!rates || !fromCode || !toCode || fromCode === toCode) return amount;
  var usdAmount = amount / (rates[fromCode] || 1);
  return usdAmount * (rates[toCode] || 1);
}
function currencySymbol(code, currencyList) {
  var found = (currencyList||[]).find(function(c){return c.code===code;});
  return found ? found.symbol : code;
}

function Ico(props) {

/* ── Bar chart ──────────────────────────────────────────────── */
function BarChart(props) {
  var data = props.data, h = props.height || 200, currency = props.currency;
  if (!data || !data.length) return <div style={{height:h,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--c-ghost)',fontSize:12}}>No data yet</div>;
  var maxV = 1;
  for (var k=0;k<data.length;k++) if(data[k].spend>maxV) maxV=data[k].spend;
  var PL=44,PR=8,PT=10,PB=40,VW=380,VH=h;
  var cW=VW-PL-PR, cH=VH-PT-PB;
  var bW=Math.min(38,Math.max(8,cW/data.length-14));
  var gap=(cW-data.length*bW)/(data.length+1);
  var gridEls=[0,.5,1].map(function(f){
    var y=PT+cH-f*cH, v=f*maxV;
    return <g key={'g'+f}><line x1={PL} y1={y} x2={VW-PR} y2={y} stroke="#1E293B" strokeWidth="1"/><text x={PL-4} y={y+4} textAnchor="end" fill="var(--c-text5)" fontSize="9">{v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v.toFixed(0)}</text></g>;
  });
  var barEls=data.map(function(d,i){
    var bH=Math.max(3,(d.spend/maxV)*cH), x=PL+gap+i*(bW+gap), y=PT+cH-bH;
    var lbl=d.name.length>9?d.name.slice(0,8)+'…':d.name;
    return <g key={'b'+i}><rect x={x} y={y} width={bW} height={bH} fill={d.color} rx="3" opacity="0.85"/><text x={x+bW/2} y={VH-PB+14} textAnchor="middle" fill="var(--c-text5)" fontSize="9.5">{lbl}</text></g>;
  });
  return <svg viewBox={'0 0 '+VW+' '+VH} style={{width:'100%',height:h}}>{gridEls}{barEls}</svg>;
}

/* ── Line chart (S-Curve) ───────────────────────────────────── */
function LineChart(props) {
  var data=props.data||[],height=props.height||180,currency=props.currency;
  if(!data.length)return <div style={{height:height,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--c-text5)',fontSize:12}}>No data</div>;
  var W=600,H=height,PL=60,PR=20,PT=10,PB=30,cW=W-PL-PR,cH=H-PT-PB;
  var maxV=data.reduce(function(m,d){return Math.max(m,d.planned||0,d.actual||0);},1);
  function xp(i){return PL+(i/Math.max(1,data.length-1))*cW;}
  function yp(v){return PT+cH-(v/maxV)*cH;}
  var grid=[0,0.25,0.5,0.75,1];
  var plannedPts=data.map(function(d,i){return xp(i)+','+yp(d.planned||0);}).join(' ');
  var actualPts=data.map(function(d,i){return xp(i)+','+yp(d.actual||0);}).join(' ');
  var areaActual=actualPts+' '+xp(data.length-1)+','+(PT+cH)+' '+xp(0)+','+(PT+cH);
  return (
    <div>
      <svg width="100%" viewBox={'0 0 '+W+' '+H} style={{display:'block'}}>
        {grid.map(function(f){
          var yv=PT+cH*(1-f),val=maxV*f;
          return <g key={f}>
            <line x1={PL} y1={yv} x2={W-PR} y2={yv} stroke="rgba(255,255,255,.04)" strokeWidth="1"/>
            <text x={PL-5} y={yv+3.5} textAnchor="end" fill="rgba(148,163,184,.5)" fontSize="9">{val>=1000?'$'+(val/1000).toFixed(0)+'k':'$'+val.toFixed(0)}</text>
          </g>;
        })}
        {data.map(function(d,i){return <text key={i} x={xp(i)} y={H-2} textAnchor="middle" fill="rgba(148,163,184,.5)" fontSize="9">{d.label}</text>;})}
        <polygon points={areaActual} fill="rgba(52,211,153,.06)"/>
        <polyline points={plannedPts} fill="none" stroke="#60A5FA" strokeWidth="2" strokeDasharray="5 3"/>
        <polyline points={actualPts} fill="none" stroke="#34D399" strokeWidth="2"/>
        {data.map(function(d,i){return <g key={i}><circle cx={xp(i)} cy={yp(d.planned||0)} r="3" fill="#60A5FA"/>{d.actual>0&&<circle cx={xp(i)} cy={yp(d.actual||0)} r="3" fill="#34D399"/>}</g>;})}
      </svg>
      <div style={{display:'flex',gap:18,justifyContent:'center',marginTop:6}}>
        <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--c-text5)'}}>
          <svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#60A5FA" strokeWidth="2" strokeDasharray="5 3"/></svg> Planned
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--c-text5)'}}>
          <svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" stroke="#34D399" strokeWidth="2"/></svg> Committed
        </div>
      </div>
    </div>
  );
}

/* ── Modal ──────────────────────────────────────────────────── */
function Modal(props) {
  var _md = React.useRef(false);
  /* Only mark a close-intent if mousedown began ON the overlay itself */
  function onOverlayMouseDown(e) {
    _md.current = (e.target === e.currentTarget);
  }
  /* Only close if mousedown AND mouseup both hit the overlay */
  function onOverlayMouseUp(e) {
    if (_md.current && e.target === e.currentTarget) {
      /* no-op — intentionally do NOT close on backdrop click */
    }
    _md.current = false;
  }
  return (
    <div
      className="modal-overlay"
      onMouseDown={onOverlayMouseDown}
      onMouseUp={onOverlayMouseUp}
      style={{position:'fixed',inset:0,background:'rgba(0,0,0,.85)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}
    >
      <div
        className="modal-sheet"
        onMouseDown={function(e){e.stopPropagation();}}
        onMouseUp={function(e){e.stopPropagation();}}
        onTouchStart={function(e){e.stopPropagation();}}
        onTouchEnd={function(e){e.stopPropagation();}}
        style={{background:'var(--c-surface)',borderRadius:14,border:'1px solid var(--c-border2)',width:props.w||500,maxWidth:'100%',maxHeight:'90vh',display:'flex',flexDirection:'column'}}
      >
        <div style={{padding:'16px 20px',borderBottom:'1px solid var(--c-border2)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <h3 style={{margin:0,fontSize:14.5,fontWeight:700,color:'var(--c-text1)'}}>{props.title}</h3>
          <button onClick={props.onClose} style={{background:'none',border:'none',color:'var(--c-text5)',display:'flex',padding:4}}><Ico n="x" size={16}/></button>
        </div>
        <div style={{padding:'18px 20px',overflowY:'auto',flex:1,WebkitOverflowScrolling:'touch'}}>{props.children}</div>
        {props.footer&&<div style={{padding:'13px 20px',borderTop:'1px solid var(--c-border2)',display:'flex',justifyContent:'flex-end',gap:9,flexShrink:0}}>{props.footer}</div>}
      </div>
    </div>
  );
}

      {/* Table */}
      <div style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:12,overflow:'hidden'}}>

                {filtered.map(function(u, idx){
                  var isMe=currentUser&&u.id===currentUser.id;

                    <tr key={u.id} style={{borderTop:idx>0?'1px solid var(--c-border)':'none',background:isMe?'rgba(245,158,11,.03)':(!active?'rgba(248,113,113,.02)':'transparent')}}

                          <div style={{position:'relative',flexShrink:0}}>

                              {!active&&<span style={{fontSize:9.5,fontWeight:700,color:'#F87171',background:'rgba(248,113,113,.12)',padding:'1px 6px',borderRadius:999,border:'1px solid rgba(248,113,113,.25)',flexShrink:0}}>INACTIVE</span>}

                                style={{background:'none',border:'none',color:'var(--c-ghost)',display:'flex',padding:2,flexShrink:0,cursor:'pointer'}}

                                <Ico n="copy" size={11}/>
                              </button>

                        </div>
                      </td>

                      {/* Role */}
                      <td style={{padding:'13px 16px'}}>
                        <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 10px',borderRadius:999,fontSize:11.5,fontWeight:500,color:rCfg.color,background:rCfg.bg,border:'1px solid '+rCfg.color+'30',whiteSpace:'nowrap'}}>
                          <span style={{width:5,height:5,borderRadius:'50%',background:rCfg.color,flexShrink:0}}/>
                          {u.role}
                        </span>
                      </td>

                      {/* Department */}
                      <td style={{padding:'13px 16px'}}>
                        <span style={{fontSize:12.5,color:u.department?'var(--c-text3)':'var(--c-ghost)'}}>{u.department||'—'}</span>
                      </td>

                      {/* Status toggle */}
                      <td style={{padding:'13px 16px'}}>
                        <button onClick={function(){onToggleActive(u);}}
                          title={(active?'Deactivate':'Activate')+' user'}
                          style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:999,fontSize:11.5,fontWeight:500,cursor:'pointer',
                            background:active?'rgba(52,211,153,.1)':'rgba(248,113,113,.1)',
                            border:'1px solid '+(active?'rgba(52,211,153,.3)':'rgba(248,113,113,.3)'),
                            color:active?'#34D399':'#F87171'
                          }}>
                          <span style={{width:6,height:6,borderRadius:'50%',background:active?'#34D399':'#F87171'}}/>
                          {active?'Active':'Inactive'}
                        </button>
                      </td>

                      {/* Joined */}
                      <td style={{padding:'13px 16px'}}>
                        <span style={{fontSize:12.5,color:'var(--c-text4)',whiteSpace:'nowrap'}}>{shortDate(u.created_at)}</span>
                      </td>

                      {/* Actions */}
                      <td style={{padding:'13px 16px',paddingRight:20}}>
                        <div style={{display:'flex',gap:5,justifyContent:'flex-end'}}>
                          {/* Edit */}
                          <button onClick={function(){setEditUser(u);}} title="Edit profile"
                            style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:6,padding:'5px 8px',color:'#60A5FA',display:'flex',alignItems:'center',gap:4,fontSize:11.5}}>
                            <Ico n="edit" size={11}/>
                          </button>
                          {/* Reset password */}
                          <button onClick={function(){setResetUser(u);}} title="Send password reset"
                            style={{background:'rgba(167,139,250,.1)',border:'1px solid rgba(167,139,250,.2)',borderRadius:6,padding:'5px 8px',color:'#A78BFA',display:'flex',alignItems:'center',gap:4,fontSize:11.5}}>
                            <Ico n="lock" size={11}/>
                          </button>
                          {/* Delete */}
                          {!isMe&&(
                            <button onClick={function(){setDeleteUser(u);}} title="Remove user"
                              style={{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.2)',borderRadius:6,padding:'5px 8px',color:'#F87171',display:'flex',alignItems:'center',gap:4,fontSize:11.5}}>
                              <Ico n="trash" size={11}/>
                            </button>
                          )}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        {/* Table footer */}
        <div style={{padding:'10px 20px',borderTop:'1px solid var(--c-border)',background:'var(--c-header)',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
          <span style={{fontSize:12,color:'var(--c-text5)'}}>{activeCount} active · {users.length-activeCount} inactive</span>
          <div style={{display:'flex',gap:10}}>
            {ROLES.map(function(r){
              var cnt=roleCounts[r]||0;
              if(!cnt)return null;
              var cfg=ROLE_CFG[r]||{color:'var(--c-text3)'};
              return <div key={r} style={{display:'flex',alignItems:'center',gap:4,fontSize:11.5,color:cfg.color}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:cfg.color}}/>{cnt} {r}
              </div>;
            })}
          </div>
        </div>
      </div>

      {/* Role guide */}
      <div style={{background:'rgba(96,165,250,.04)',border:'1px solid rgba(96,165,250,.12)',borderRadius:10,padding:'12px 16px',display:'flex',alignItems:'flex-start',gap:10}}>
        <Ico n="shield" size={14} color="#60A5FA" style={{marginTop:1,flexShrink:0}}/>
        <div style={{fontSize:12.5,color:'var(--c-text4)',lineHeight:1.65}}>
          <strong style={{color:'var(--c-text3)'}}>Role guide — </strong>
          <strong style={{color:'#F59E0B'}}>Admin</strong>: full access &amp; user management ·{' '}
          <strong style={{color:'#3B82F6'}}>Manager</strong>: create &amp; edit all projects ·{' '}
          <strong style={{color:'#34D399'}}>Member</strong>: edit assigned projects ·{' '}
          <strong style={{color:'var(--c-text3)'}}>Viewer</strong>: read-only.
          {!DEMO&&<span style={{display:'block',marginTop:4}}>First-time admin setup — run in Supabase SQL Editor: <code style={{background:'rgba(255,255,255,.06)',padding:'1px 6px',borderRadius:4,fontSize:11}}>UPDATE profiles SET role = 'admin' WHERE email = 'your@email.com';</code></span>}
          {DEMO&&<span style={{color:'#60A5FA',display:'block',marginTop:4}}>Demo Mode — changes are local only and not persisted.</span>}
        </div>
      </div>

      {/* Modals */}
      {editUser&&<EditProfileModal user={editUser} onSave={handleSave} onClose={function(){setEditUser(null);}}/>}
      {deleteUser&&<DeleteConfirmModal user={deleteUser} onConfirm={handleDelete} onClose={function(){setDeleteUser(null);}}/>}
      {resetUser&&<ResetPasswordModal user={resetUser} onConfirm={handleReset} onClose={function(){setResetUser(null);}}/>}
    </div>
  );
}

/* ── Project Modal ──────────────────────────────────────────── */
function ProjectModal(props) {
  var project=props.project,onSave=props.onSave,onClose=props.onClose,currencies=props.currencies||[];
  var activeCurs=currencies.filter(function(c){return c.is_active!==false;});
  if(!activeCurs.length) activeCurs=[{code:'USD',name:'US Dollar',symbol:'$'}];
  var _f=useState(project?Object.assign({manpower_budget:''}, project, {budget:String(project.budget||''), manpower_budget:String(project.manpower_budget||'')}):{name:'',description:'',budget:'',manpower_budget:'',color:PC[0],currency:'USD'});
  var form=_f[0],setForm=_f[1];
  var _e=useState(''),error=_e[0],setError=_e[1];
  var _s=useState(false),saving=_s[0],setSaving=_s[1];
  function set(k,v){setForm(function(f){return Object.assign({},f,{[k]:v});});}
  async function submit(){
    if(!form.name.trim())return setError('Project name is required.');
    if(!form.budget||isNaN(+form.budget)||+form.budget<=0)return setError('A valid budget is required.');
    setError('');setSaving(true);
    await onSave(Object.assign({},form,{budget:+form.budget,manpower_budget:form.manpower_budget?+form.manpower_budget:0,id:project&&project.id}));
    setSaving(false);
  }
  var footer=(<div style={{display:'flex',gap:9}}>
    <button onClick={onClose} style={{padding:'8px 18px',background:'transparent',border:'1px solid var(--c-border2)',borderRadius:8,color:'var(--c-text3)',fontSize:13}}>Cancel</button>
    <button onClick={submit} disabled={saving} style={{padding:'8px 20px',background:'#F59E0B',border:'none',borderRadius:8,color:'#000',fontSize:13,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
      <Ico n="save" size={13}/>{saving?'Saving…':(project?'Save Changes':'Create Project')}
    </button>
  </div>);
  return (
    <Modal title={project?'Edit Project':'Create New Project'} onClose={onClose} w={480} footer={footer}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div><label style={LBL}>Project Name *</label><input style={INP} value={form.name} onChange={function(e){set('name',e.target.value);}} placeholder="e.g. IT Infrastructure Upgrade"/></div>
        <div><label style={LBL}>Description</label><input style={INP} value={form.description} onChange={function(e){set('description',e.target.value);}} placeholder="Brief description…"/></div>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:14}}>
          <div>
            <label style={LBL}>Procurement Budget *</label>
            <input style={INP} type="number" min="0" value={form.budget} onChange={function(e){set('budget',e.target.value);}} placeholder="0"/>
          </div>
          <div>
            <label style={LBL}>Currency</label>
            <select style={Object.assign({},INP,{cursor:'pointer'})} value={form.currency||'USD'} onChange={function(e){set('currency',e.target.value);}}>
              {activeCurs.map(function(c){return <option key={c.code} value={c.code}>{c.code} — {c.name}</option>;})}            </select>
          </div>
        </div>
        <div>
          <label style={LBL}>Budgeted Manpower Cost <span style={{color:'var(--c-ghost)',fontWeight:400}}>(optional)</span></label>
          <input style={INP} type="number" min="0" value={form.manpower_budget} onChange={function(e){set('manpower_budget',e.target.value);}} placeholder="0"/>
        </div>
        <div style={{padding:'11px 14px',background:'var(--c-bg)',borderRadius:8,border:'1px solid var(--c-border2)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:12,color:'var(--c-text5)'}}>Total budget preview</span>
          <div style={{textAlign:'right'}}>
            <span style={{fontSize:16,fontWeight:700,color:'var(--c-text1)'}}>{(form.budget&&!isNaN(+form.budget))||(form.manpower_budget&&!isNaN(+form.manpower_budget))?fmt((+form.budget||0)+(+form.manpower_budget||0),form.currency||'USD'):'—'}</span>
            {form.manpower_budget&&!isNaN(+form.manpower_budget)&&+form.manpower_budget>0&&<div style={{fontSize:10.5,color:MP_COLOR,marginTop:2}}>incl. {fmt(+form.manpower_budget,form.currency||'USD')} manpower</div>}
          </div>
        </div>
        <div><label style={LBL}>Project Colour</label>
          <div style={{display:'flex',gap:9}}>{PC.map(function(c){return <button key={c} onClick={function(){set('color',c);}} style={{width:28,height:28,borderRadius:'50%',background:c,border:form.color===c?'3px solid var(--c-swatch-sel)':'3px solid transparent'}}/>;})}</div>
        </div>
        {error&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.25)',borderRadius:7,fontSize:12.5,color:'#F87171'}}><Ico n="alert" size={13}/>{error}</div>}
      </div>
    </Modal>
  );
}

/* ── Item Modal ─────────────────────────────────────────────── */
function ItemModal(props) {
  var item=props.item, projectId=props.projectId, categories=props.categories;
  var currencies=props.currencies, currency=props.currency, rates=props.rates, defStage=props.defStage, onSave=props.onSave, onClose=props.onClose;

  var activeCurs = (currencies||[]).filter(function(c){return c.is_active!==false;});
  var defaultCur = item ? (item.item_currency||currency||'USD') : (currency||'USD');

  var initQty      = item ? (item.qty||1)                     : 1;
  var initUnitCost = item ? (item.unit_cost||item.cost||'')   : '';
  var initDelivery = item ? (item.delivery_date||item.deadline||'') : '';
  var initLead     = item ? (item.lead_time_days||'')         : '';

  var def = {
    name:          item ? item.name     : '',
    category:      item ? item.category : (categories[0]||'Hardware'),
    vendor:        item ? item.vendor   : '',
    status:        item ? item.status   : (defStage||'Creation'),
    item_currency: defaultCur,
    qty:           String(initQty),
    unit_cost:     initUnitCost==='' ? '' : String(initUnitCost),
    delivery_date: initDelivery,
    lead_time_days:initLead==='' ? '' : String(initLead),
    order_by_date: item ? (item.order_by_date||calcOrderBy(initDelivery,initLead)) : '',
    total_cost:    +initQty * (+initUnitCost||0),
    act_cost:      item && item.act_cost!=null ? String(item.act_cost) : '',
    notes:         item ? (item.notes||'') : '',
  };

  var _f=useState(def), form=_f[0], setForm=_f[1];
  var _e=useState(''),  error=_e[0], setError=_e[1];
  var _s=useState(false), saving=_s[0], setSaving=_s[1];

  function set(k,v) {
    setForm(function(f) {
      var next = Object.assign({},f,{[k]:v});
      if (k==='qty'||k==='unit_cost') {
        var q=+(k==='qty'?v:next.qty)||0, uc=+(k==='unit_cost'?v:next.unit_cost)||0;
        next.total_cost = q*uc;
      }
      if (k==='delivery_date'||k==='lead_time_days') {
        next.order_by_date = calcOrderBy(k==='delivery_date'?v:next.delivery_date, k==='lead_time_days'?v:next.lead_time_days);
      }
      return next;
    });
  }

  var qty       = Math.max(1, Math.round(+form.qty||1));
  var unitCost  = +form.unit_cost||0;
  var totalCost = qty * unitCost;
  var orderBy   = form.order_by_date || calcOrderBy(form.delivery_date, form.lead_time_days);
  var urgency   = urgencyLabel(orderBy, form.status);
  var CUR       = form.item_currency || currency || 'USD';
  var convertedPreview = (CUR!==currency&&rates&&rates[CUR]&&rates[currency]&&totalCost>0)?convert(totalCost,CUR,currency,rates):null;

  async function submit() {
    if (!form.name.trim())  return setError('Item name is required.');
    if (!form.vendor.trim()) return setError('Vendor is required.');
    if (!form.unit_cost || isNaN(+form.unit_cost) || +form.unit_cost < 0)
      return setError('Unit cost is required (enter 0 if free).');
    setError(''); setSaving(true);
    try {
      var q  = Math.max(1, Math.round(+form.qty||1));
      var uc = Math.max(0, +form.unit_cost||0);
      var ob = form.delivery_date && form.lead_time_days ? calcOrderBy(form.delivery_date, form.lead_time_days) : null;
      await onSave({
        name:           form.name.trim(),
        category:       form.category,
        vendor:         form.vendor.trim(),
        status:         form.status,
        item_currency:  CUR,
        qty:            q,
        unit_cost:      uc,
        cost:           q * uc,
        act_cost:       form.act_cost!==''&&!isNaN(+form.act_cost)?+form.act_cost:null,
        delivery_date:  form.delivery_date || null,
        lead_time_days: form.lead_time_days ? +form.lead_time_days : null,
        order_by_date:  ob || null,
        notes:          form.notes || null,
        id:             item ? item.id        : undefined,
        projectId:      item ? item.projectId : projectId,
      });
    } catch(e) {
      setError('Save failed: ' + (e.message||'unknown error'));
      setSaving(false);
    }
  }

  var footer=(<div style={{display:'flex',gap:9}}>
    <button onClick={onClose} style={{padding:'8px 18px',background:'transparent',border:'1px solid var(--c-border2)',borderRadius:8,color:'var(--c-text3)',fontSize:13}}>Cancel</button>
    <button onClick={submit} disabled={saving} style={{padding:'8px 20px',background:'#F59E0B',border:'none',borderRadius:8,color:'#000',fontSize:13,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
      <Ico n="save" size={13}/>{saving?'Saving…':(item?'Save Changes':'Add Equipment')}
    </button>
  </div>);

  return (
    <Modal title={item?'Edit Equipment':'Add Equipment'} onClose={onClose} w={580} footer={footer}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>

        {/* Name */}
        <div style={{gridColumn:'1/-1'}}>
          <label style={LBL}>Equipment / Item Name *</label>
          <input style={INP} value={form.name} onChange={function(e){set('name',e.target.value);setError('');}} placeholder="e.g. Dell XPS Workstations"/>
        </div>

        {/* Category + Stage */}
        <div>
          <label style={LBL}>Category</label>
          <select style={Object.assign({},INP,{cursor:'pointer'})} value={form.category} onChange={function(e){set('category',e.target.value);}}>
            {categories.map(function(c){return <option key={c} value={c}>{c}</option>;})}
          </select>
        </div>
        <div>
          <label style={LBL}>Pipeline Stage</label>
          <select style={Object.assign({},INP,{cursor:'pointer'})} value={form.status} onChange={function(e){set('status',e.target.value);}}>
            {STAGES.map(function(s){return <option key={s} value={s}>{s}</option>;})}
          </select>
        </div>

        {/* Vendor */}
        <div style={{gridColumn:'1/-1'}}>
          <label style={LBL}>Vendor *</label>
          <input style={INP} value={form.vendor} onChange={function(e){set('vendor',e.target.value);setError('');}} placeholder="e.g. Dell Technologies"/>
        </div>

        {/* Currency + Qty */}
        <div>
          <label style={LBL}>Currency</label>
          <select style={Object.assign({},INP,{cursor:'pointer'})} value={CUR} onChange={function(e){set('item_currency',e.target.value);}}>
            {activeCurs.map(function(c){return <option key={c.code} value={c.code}>{c.code} — {c.name}</option>;})}
          </select>
        </div>
        <div>
          <label style={LBL}>Quantity</label>
          <input style={INP} type="number" min="1" step="1" value={form.qty} onChange={function(e){set('qty',e.target.value);}} placeholder="1"/>
        </div>

        {/* Unit cost */}
        <div style={{gridColumn:'1/-1'}}>
          <label style={LBL}>Unit Cost ({CUR}) *</label>
          <input style={INP} type="number" min="0" step="0.01" value={form.unit_cost} onChange={function(e){set('unit_cost',e.target.value);setError('');}} placeholder="0.00"/>
        </div>

        {/* Total cost (computed) */}
        <div style={{gridColumn:'1/-1'}}>
          <div style={{padding:'11px 14px',background:'var(--c-bg)',borderRadius:8,border:'1px solid var(--c-border2)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontSize:12,color:'var(--c-text5)'}}>
              Total Cost
              {form.qty&&form.unit_cost
                ? <span style={{color:'var(--c-ghost)',marginLeft:8}}>{qty} × {fmt(unitCost,CUR)}</span>
                : null}
            </div>
            <span style={{fontSize:18,fontWeight:700,color:'var(--c-text1)'}}>{fmt(totalCost,CUR)}</span>
          </div>
          {convertedPreview!=null&&(
            <div style={{marginTop:6,padding:'9px 14px',background:'rgba(245,158,11,.07)',border:'1px solid rgba(245,158,11,.2)',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:11.5,color:'#F59E0B'}}>≈ {currency} equivalent (project currency)</span>
              <span style={{fontSize:16,fontWeight:700,color:'#F59E0B'}}>{fmt(convertedPreview,currency)}</span>
            </div>
          )}
        </div>

        {/* Actual / PO Cost */}
        <div style={{gridColumn:'1/-1'}}>
          <label style={LBL}>Actual / PO Amount ({CUR}) <span style={{fontSize:10,color:'var(--c-ghost)',fontWeight:400}}>— enter the real committed amount when placing order</span></label>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <input style={Object.assign({},INP,{flex:1})} type="number" min="0" step="0.01" value={form.act_cost}
              onChange={function(e){set('act_cost',e.target.value);}} placeholder={'Defaults to est. cost ('+fmt(totalCost,CUR)+') if blank'}/>
            {form.act_cost!==''&&!isNaN(+form.act_cost)&&(
              <div style={{fontSize:12,color:+form.act_cost>totalCost?'#F87171':+form.act_cost<totalCost?'#34D399':'var(--c-text5)',whiteSpace:'nowrap'}}>
                {+form.act_cost>totalCost?'▲':'▼'} {fmt(Math.abs(+form.act_cost-totalCost),CUR)} {+form.act_cost>totalCost?'over':'under'} est.
              </div>
            )}
          </div>
          <div style={{marginTop:5,fontSize:10.5,color:'var(--c-text5)'}}>Counts as committed spend once status reaches <strong>Order</strong></div>
        </div>

        {/* Delivery + Lead time */}
        <div>
          <label style={LBL}>Delivery Date <span style={{color:'var(--c-ghost)',fontWeight:400}}>(optional)</span></label>
          <input style={Object.assign({},INP,{colorScheme:'dark'})} type="date" value={form.delivery_date} onChange={function(e){set('delivery_date',e.target.value);}}/>
        </div>
        <div>
          <label style={LBL}>Lead Time (days) <span style={{color:'var(--c-ghost)',fontWeight:400}}>(optional)</span></label>
          <input style={INP} type="number" min="0" step="1" value={form.lead_time_days} onChange={function(e){set('lead_time_days',e.target.value);}} placeholder="e.g. 14"/>
        </div>

        {/* Order by (auto) */}
        <div style={{gridColumn:'1/-1'}}>
          <div style={{padding:'11px 14px',background:'var(--c-bg)',borderRadius:8,border:'1px solid '+(orderBy?urgency.color+'40':'var(--c-border2)'),display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:10.5,color:'var(--c-text5)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:2}}>
                Order By Date <span style={{color:'var(--c-ghost)',fontWeight:400,textTransform:'none',letterSpacing:0}}>(Delivery − Lead time)</span>
              </div>
              <div style={{fontSize:16,fontWeight:700,color:orderBy?urgency.color:'var(--c-ghost)'}}>
                {orderBy || '— fill Delivery Date and Lead Time above —'}
              </div>
            </div>
            {orderBy&&<span style={{fontSize:10,fontWeight:700,color:urgency.color,background:urgency.color+'15',padding:'3px 9px',borderRadius:999,border:'1px solid '+urgency.color+'30',whiteSpace:'nowrap'}}>{urgency.label}</span>}
          </div>
        </div>

        {/* Notes */}
        <div style={{gridColumn:'1/-1'}}>
          <label style={LBL}>Notes <span style={{color:'var(--c-ghost)',fontWeight:400}}>(optional)</span></label>
          <textarea
            value={form.notes}
            onChange={function(e){set('notes',e.target.value);}}
            placeholder="Supplier contact, spec details, special instructions…"
            rows={3}
            style={Object.assign({},INP,{resize:'vertical',lineHeight:1.55,fontFamily:'inherit'})}
          />
        </div>

        {/* Error */}
        {error&&(
          <div style={{gridColumn:'1/-1',display:'flex',alignItems:'center',gap:8,padding:'10px 12px',background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.3)',borderRadius:8,fontSize:12.5,color:'#F87171'}}>
            <Ico n="alert" size={14}/>{error}
          </div>
        )}
      </div>
    </Modal>
  );
}


/* ── Manpower Tab (inline line-item editor) ─────────────────── */
function ManpowerTab(props) {
  var project=props.project, manpower=props.manpower||[];
  var onSave=props.onSave, onDelete=props.onDelete;
  var manpowerTypes=props.manpowerTypes||DEMO_MANPOWER_TYPES;
  var rm=useMemo(function(){return mpRatesMap(manpowerTypes);},[manpowerTypes]);

  var _pn=useState(null),pendingNew=_pn[0],setPendingNew=_pn[1];
  var _er=useState(null),editingRow=_er[0],setEditingRow=_er[1];
  var _sav=useState(false),saving=_sav[0],setSaving=_sav[1];

  var pm=manpower.filter(function(m){return m.projectId===project.id;});

  var grandEstD=0,grandEstC=0,grandActD=0,grandActC=0;
  pm.forEach(function(m){
    var rate=rm[m.manpower_type]||0,qty=m.qty||1,fte=m.fte!=null?m.fte:1;
    grandEstD+=(m.est_hours||0)*qty; grandActD+=(m.act_hours||0)*qty;
    grandEstC+=(m.est_hours||0)*qty*fte*rate; grandActC+=(m.act_hours||0)*qty*fte*rate;
  });

  /* est_hours column stores estimated days (auto from dates); act_hours stores actual days (manual) */
  function blankForm(){return{description:'',manpower_type:(manpowerTypes[0]&&manpowerTypes[0].name)||'',qty:'1',start_date:'',end_date:'',fte:'1',act_days:'0'};}
  function upd(form,k,v){return Object.assign({},form,{[k]:v});}
  function calc(form){
    var rate=rm[form.manpower_type]||0;
    var qty=Math.max(1,parseInt(form.qty)||1);
    var days=calcDays(form.start_date,form.end_date);        /* estimated days from start/end */
    var actDays=Math.max(0,parseFloat(form.act_days)||0);    /* actual days worked (manual) */
    var fte=clampFte(form.fte);
    /* Est. Cost = rate/day × no. days × FTE × qty */
    return{rate:rate,qty:qty,days:days,actDays:actDays,fte:fte,
           estC:rate*days*fte*qty, actC:rate*actDays*fte*qty};
  }

  async function commitNew(){
    if(!pendingNew||!pendingNew.description.trim()){setPendingNew(null);return;}
    var c=calc(pendingNew); setSaving(true);
    try {
      await onSave({description:pendingNew.description.trim(),manpower_type:pendingNew.manpower_type,qty:c.qty,
        start_date:dOnly(pendingNew.start_date)||null,end_date:dOnly(pendingNew.end_date)||null,
        fte:c.fte,est_hours:c.days,act_hours:c.actDays,projectId:project.id});
      setPendingNew(null);
    } catch(e){ /* toast shown by saveManpower */ }
    setSaving(false);
  }
  async function commitEdit(){
    if(!editingRow)return;
    var c=calc(editingRow.form); setSaving(true);
    try {
      await onSave({id:editingRow.id,description:editingRow.form.description.trim(),manpower_type:editingRow.form.manpower_type,
        qty:c.qty,start_date:dOnly(editingRow.form.start_date)||null,end_date:dOnly(editingRow.form.end_date)||null,
        fte:c.fte,est_hours:c.days,act_hours:c.actDays,projectId:editingRow.projectId});
      setEditingRow(null);
    } catch(e){ /* toast shown by saveManpower */ }
    setSaving(false);
  }

  function exportExcel(){
    if(!window.XLSX){alert('Excel library not loaded.');return;}
    var XLSX=window.XLSX;
    var cols=['Description of Work','Manpower Type','Rate/day (USD)','Qty','Start Date','End Date','Est. Days','FTE',
              'Est. Cost (USD)','Act. Days','Act. Cost (USD)'];
    var rows=[cols];
    pm.forEach(function(m){
      var rate=rm[m.manpower_type]||0,qty=m.qty||1,days=m.est_hours||calcDays(m.start_date,m.end_date);
      var fte=m.fte!=null?m.fte:1,actDays=m.act_hours||0;
      rows.push([m.description||'',m.manpower_type,rate,qty,dOnly(m.start_date),dOnly(m.end_date),days,fte,
                 rate*days*fte*qty, actDays, rate*actDays*fte*qty]);
    });
    rows.push([]);
    rows.push(['GRAND TOTAL','','','','','','','',grandEstC,'',grandActC]);
    if(project.manpower_budget>0) rows.push(['BUDGETED MANPOWER COST','','','','','','','',project.manpower_budget,'','']);
    var ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:34},{wch:20},{wch:14},{wch:6},{wch:12},{wch:12},{wch:9},{wch:6},{wch:16},{wch:10},{wch:16}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Manpower Plan');
    XLSX.writeFile(wb,(project.name||'Project').replace(/[^a-z0-9]/gi,'_')+'_Manpower.xlsx');
  }

  var ISM={background:'var(--c-input)',border:'1px solid var(--c-border2)',borderRadius:6,padding:'5px 7px',color:'var(--c-text2)',fontSize:12,width:'100%',minWidth:0};
  var TH={padding:'8px 10px',textAlign:'left',fontSize:9.5,color:'var(--c-text5)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',background:'var(--c-bg)',whiteSpace:'nowrap'};
  var THR=Object.assign({},TH,{textAlign:'right'});
  var TD={padding:'9px 10px',fontSize:12.5,color:'var(--c-text3)',borderTop:'1px solid var(--c-border)',verticalAlign:'middle'};
  var TDR=Object.assign({},TD,{textAlign:'right'});
  var TDE=Object.assign({},TD,{padding:'6px 8px'});

  function EditRow(rowProps){
    var form=rowProps.form,setForm=rowProps.setForm,onCommit=rowProps.onCommit,onCancel=rowProps.onCancel,isNew=rowProps.isNew;
    var c=calc(form);
    return (
      <tr style={{background:'rgba(245,158,11,.05)'}}>
        <td style={TDE}>
          <input autoFocus={isNew} value={form.description} onChange={function(e){setForm(upd(form,'description',e.target.value));}}
            placeholder="Description of work…" style={Object.assign({},ISM,{minWidth:160})}/>
        </td>
        <td style={TDE}>
          <select value={form.manpower_type} onChange={function(e){setForm(upd(form,'manpower_type',e.target.value));}} style={Object.assign({},ISM,{minWidth:150})}>
            {manpowerTypes.map(function(t){return <option key={t.id||t.name} value={t.name}>{t.name}</option>;})}
          </select>
        </td>
        <td style={Object.assign({},TDE,{textAlign:'right',color:MP_COLOR,fontWeight:700,whiteSpace:'nowrap'})}>
          ${c.rate.toLocaleString()}/day
        </td>
        <td style={TDE}><input type="number" min="1" step="1" value={form.qty} onChange={function(e){setForm(upd(form,'qty',e.target.value));}} style={Object.assign({},ISM,{width:50})}/></td>
        <td style={TDE}><input type="date" value={dOnly(form.start_date)} onChange={function(e){setForm(upd(form,'start_date',e.target.value));}} style={Object.assign({},ISM,{colorScheme:'dark',minWidth:120})}/></td>
        <td style={TDE}><input type="date" min={dOnly(form.start_date)||undefined} value={dOnly(form.end_date)} onChange={function(e){setForm(upd(form,'end_date',e.target.value));}} style={Object.assign({},ISM,{colorScheme:'dark',minWidth:120})}/></td>
        <td style={Object.assign({},TDE,{textAlign:'right',fontWeight:600,color:c.days>0?'#60A5FA':'var(--c-ghost)',whiteSpace:'nowrap'})}>{c.days>0?c.days+'d':'—'}</td>
        <td style={TDE}><input type="number" min="0" max="1" step="0.1" value={form.fte}
          onChange={function(e){setForm(upd(form,'fte',e.target.value));}}
          onBlur={function(e){setForm(upd(form,'fte',String(clampFte(e.target.value))));}}
          style={Object.assign({},ISM,{width:50})}/></td>
        <td style={Object.assign({},TDE,{textAlign:'right',fontWeight:700,color:'#60A5FA',whiteSpace:'nowrap'})}>${c.estC.toLocaleString('en-US',{maximumFractionDigits:0})}</td>
        <td style={TDE}><input type="number" min="0" step="0.5" value={form.act_days} onChange={function(e){setForm(upd(form,'act_days',e.target.value));}} placeholder="0" style={Object.assign({},ISM,{width:64})}/></td>
        <td style={Object.assign({},TDE,{textAlign:'right',fontWeight:700,color:'#34D399',whiteSpace:'nowrap'})}>${c.actC.toLocaleString('en-US',{maximumFractionDigits:0})}</td>
        <td style={Object.assign({},TDE,{whiteSpace:'nowrap'})}>
          <div style={{display:'flex',gap:5}}>
            <button onClick={onCommit} disabled={saving}
              style={{background:'rgba(52,211,153,.12)',border:'1px solid rgba(52,211,153,.3)',borderRadius:6,padding:'4px 10px',color:'#34D399',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:4}}>
              <Ico n="save" size={11}/>{saving?'…':'Save'}
            </button>
            <button onClick={onCancel}
              style={{background:'var(--c-bg)',border:'1px solid var(--c-border2)',borderRadius:6,padding:'4px 8px',color:'var(--c-text5)',fontSize:12}}>
              <Ico n="x" size={11}/>
            </button>
          </div>
        </td>
      </tr>
    );
  }

  return (
    <div style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:12,overflow:'hidden'}}>

      {/* Header */}
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--c-border)',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:8}}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <div style={{width:28,height:28,borderRadius:7,background:'rgba(167,139,250,.12)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <Ico n="people" size={13} color={MP_COLOR}/>
          </div>
          <div>
            <span style={{fontSize:13,fontWeight:700,color:'var(--c-text1)'}}>Manpower Plan</span>
            <span style={{fontSize:11,color:'var(--c-text5)',marginLeft:10}}>
              {pm.length} line{pm.length!==1?'s':''}
              {project.manpower_budget>0&&<span> · Budget <strong style={{color:MP_COLOR}}>${project.manpower_budget.toLocaleString('en-US',{maximumFractionDigits:0})}</strong></span>}
              &nbsp;· Est <strong style={{color:'#60A5FA'}}>${grandEstC.toLocaleString('en-US',{maximumFractionDigits:0})}</strong>
              &nbsp;· Act <strong style={{color:'#34D399'}}>${grandActC.toLocaleString('en-US',{maximumFractionDigits:0})}</strong>
            </span>
          </div>
        </div>
        <div style={{display:'flex',gap:7}}>
          <button onClick={exportExcel}
            style={{display:'flex',alignItems:'center',gap:5,padding:'6px 12px',background:'rgba(52,211,153,.1)',border:'1px solid rgba(52,211,153,.25)',borderRadius:7,color:'#34D399',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            <Ico n="download" size={12}/> Export Excel
          </button>
        </div>
      </div>

      {/* Budget utilization bar */}
      {project.manpower_budget>0&&(function(){
        var estPct=Math.min(100,Math.round((grandEstC/project.manpower_budget)*100));
        var actPct=Math.min(100,Math.round((grandActC/project.manpower_budget)*100));
        var over=grandEstC>project.manpower_budget;
        return <div style={{padding:'10px 16px',borderBottom:'1px solid var(--c-border)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
            <span style={{fontSize:11,color:'var(--c-text4)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px'}}>Manpower Budget Utilization</span>
            <span style={{fontSize:12,fontWeight:700,color:over?'#F87171':estPct>85?'#F59E0B':'#34D399'}}>{estPct}% estimated</span>
          </div>
          <div style={{position:'relative',height:8,background:'var(--c-bg)',borderRadius:999,overflow:'hidden'}}>
            <div style={{position:'absolute',height:'100%',borderRadius:999,width:estPct+'%',background:'rgba(167,139,250,.3)'}}/>
            <div style={{position:'absolute',height:'100%',borderRadius:999,width:actPct+'%',background:'linear-gradient(90deg,'+MP_COLOR+'cc,'+MP_COLOR+')'}}/>
          </div>
          <div style={{display:'flex',gap:14,marginTop:5,fontSize:10,color:'var(--c-text5)'}}>
            <span><span style={{color:'rgba(167,139,250,.5)'}}>▬</span> Est. ${grandEstC.toLocaleString('en-US',{maximumFractionDigits:0})}</span>
            <span><span style={{color:MP_COLOR}}>▬</span> Act. ${grandActC.toLocaleString('en-US',{maximumFractionDigits:0})}</span>
            <span style={{marginLeft:'auto'}}>Budget ${project.manpower_budget.toLocaleString('en-US',{maximumFractionDigits:0})}</span>
          </div>
        </div>;
      })()}

      {/* Table */}
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',minWidth:1060}}>
          <thead>
            <tr>
              <th style={Object.assign({},TH,{minWidth:180})}>Description of Work</th>
              <th style={Object.assign({},TH,{minWidth:150})}>Type</th>
              <th style={THR}>Rate/day</th>
              <th style={THR}>Qty</th>
              <th style={TH}>Start Date</th>
              <th style={TH}>End Date</th>
              <th style={THR}>Days</th>
              <th style={THR}>FTE</th>
              <th style={THR}>Est. Cost</th>
              <th style={THR}>Act. Days</th>
              <th style={THR}>Act. Cost</th>
              <th style={TH}></th>
            </tr>
          </thead>
          <tbody>
            {pm.map(function(m){
              if(editingRow&&editingRow.id===m.id){
                return <EditRow key={m.id} form={editingRow.form} setForm={function(f){setEditingRow({id:m.id,projectId:m.projectId,form:f});}} onCommit={commitEdit} onCancel={function(){setEditingRow(null);}} isNew={false}/>;
              }
              var rate=rm[m.manpower_type]||0,qty=m.qty||1,fte=m.fte!=null?m.fte:1;
              var days=m.est_hours||calcDays(m.start_date,m.end_date);
              var actDays=m.act_hours||0;
              var estC=rate*days*fte*qty, actC=rate*actDays*fte*qty;
              return (
                <tr key={m.id}
                  onMouseEnter={function(e){e.currentTarget.style.background='rgba(255,255,255,.025)';}}
                  onMouseLeave={function(e){e.currentTarget.style.background='transparent';}}>
                  <td style={TD}><span style={{color:'var(--c-text2)',fontWeight:500}}>{m.description||'—'}</span></td>
                  <td style={TD}>
                    <span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',borderRadius:999,fontSize:11,fontWeight:600,background:'rgba(167,139,250,.1)',border:'1px solid rgba(167,139,250,.2)',color:MP_COLOR,whiteSpace:'nowrap'}}>
                      {m.manpower_type}
                    </span>
                  </td>
                  <td style={Object.assign({},TDR,{color:MP_COLOR,fontWeight:600,whiteSpace:'nowrap'})}>${rate.toLocaleString()}/day</td>
                  <td style={Object.assign({},TDR,{fontWeight:600,color:'var(--c-text2)'})}>{qty}</td>
                  <td style={TD}>{dOnly(m.start_date)||'—'}</td>
                  <td style={TD}>{dOnly(m.end_date)||'—'}</td>
                  <td style={Object.assign({},TDR,{color:'#60A5FA',fontWeight:600})}>{days?days+'d':'—'}</td>
                  <td style={TDR}>{fte.toFixed(1)}</td>
                  <td style={Object.assign({},TDR,{fontWeight:700,color:'#60A5FA'})}>${estC.toLocaleString('en-US',{maximumFractionDigits:0})}</td>
                  <td style={Object.assign({},TDR,{color:'#34D399'})}>{actDays.toLocaleString()}</td>
                  <td style={Object.assign({},TDR,{fontWeight:700,color:'#34D399'})}>${actC.toLocaleString('en-US',{maximumFractionDigits:0})}</td>
                  <td style={Object.assign({},TDR,{whiteSpace:'nowrap'})}>
                    <div style={{display:'flex',gap:4,justifyContent:'flex-end'}}>
                      <button onClick={function(){setEditingRow({id:m.id,projectId:m.projectId,form:{description:m.description||'',manpower_type:m.manpower_type,qty:String(m.qty||1),start_date:dOnly(m.start_date),end_date:dOnly(m.end_date),fte:String(m.fte!=null?m.fte:1),act_days:String(m.act_hours||0)}});}}
                        style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:5,padding:'4px 7px',color:'#60A5FA',display:'flex',cursor:'pointer'}}>
                        <Ico n="edit" size={11}/>
                      </button>
                      <button onClick={function(){onDelete(m.id);}}
                        style={{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.2)',borderRadius:5,padding:'4px 7px',color:'#F87171',display:'flex',cursor:'pointer'}}>
                        <Ico n="trash" size={11}/>
                      </button>
                    </div>
                  </td>
                </tr>
              );
            })}

            {/* New pending row */}
            {pendingNew&&<EditRow form={pendingNew} setForm={setPendingNew} onCommit={commitNew} onCancel={function(){setPendingNew(null);}} isNew={true}/>}
          </tbody>

          {/* Grand total footer */}
          {pm.length>0&&(
            <tfoot>
              <tr style={{background:'rgba(245,158,11,.05)'}}>
                <td colSpan={8} style={{padding:'9px 10px',fontSize:12,fontWeight:700,color:'#F59E0B',textTransform:'uppercase',letterSpacing:'.4px',borderTop:'2px solid rgba(245,158,11,.25)'}}>
                  Grand Total {project.manpower_budget>0&&<span style={{fontWeight:600,textTransform:'none',color:grandEstC>project.manpower_budget?'#F87171':'#34D399',marginLeft:8}}>{grandEstC>project.manpower_budget?'▲ over':'▼ under'} budget by ${Math.abs(grandEstC-project.manpower_budget).toLocaleString('en-US',{maximumFractionDigits:0})}</span>}
                </td>
                <td style={Object.assign({},TDR,{fontWeight:700,color:'#60A5FA',fontSize:13,borderTop:'2px solid rgba(245,158,11,.25)'})}>${grandEstC.toLocaleString('en-US',{maximumFractionDigits:0})}</td>
                <td style={Object.assign({},TDR,{fontWeight:700,color:'#34D399',fontSize:13,borderTop:'2px solid rgba(245,158,11,.25)'})}>{grandActD.toLocaleString()}</td>
                <td style={Object.assign({},TDR,{fontWeight:700,color:'#34D399',fontSize:13,borderTop:'2px solid rgba(245,158,11,.25)'})}>${grandActC.toLocaleString('en-US',{maximumFractionDigits:0})}</td>
                <td style={{borderTop:'2px solid rgba(245,158,11,.25)'}}/>
              </tr>
            </tfoot>
          )}
        </table>
      </div>

      {/* Add Line button */}
      <div style={{padding:'10px 14px',borderTop:'1px solid var(--c-border)'}}>
        <button onClick={function(){if(!pendingNew){setPendingNew(blankForm());}}}
          disabled={!!pendingNew}
          style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',background:pendingNew?'var(--c-bg)':'rgba(245,158,11,.1)',border:'1px dashed '+(pendingNew?'var(--c-border2)':'rgba(245,158,11,.4)'),borderRadius:8,color:pendingNew?'var(--c-ghost)':'#F59E0B',fontSize:12.5,fontWeight:600,cursor:pendingNew?'not-allowed':'pointer',transition:'all .15s'}}>
          <Ico n="plus" size={13}/> Add Line
        </button>
      </div>
    </div>
  );
}

/* ── Dashboard ──────────────────────────────────────────────── */
function Dashboard(props) {
  var projects=props.projects,items=props.items,currency=props.currency,manpower=props.manpower||[];
  var rm=useMemo(function(){return mpRatesMap(props.manpowerTypes||DEMO_MANPOWER_TYPES);},[props.manpowerTypes]);

  /* ── Widget visibility (eye toggles) ─── */
  var _wv=useState(function(){try{return JSON.parse(localStorage.getItem('pf-dash-w')||'{}');}catch(e){return{};}});
  var wVis=_wv[0],setWVis=_wv[1];
  function toggleW(id){setWVis(function(v){var n=Object.assign({},v,{[id]:!v[id]});try{localStorage.setItem('pf-dash-w',JSON.stringify(n));}catch(e){}return n;});}

  /* ── Global metrics ─── */
  var tProcBudget=projects.reduce(function(s,p){return s+(p.budget||0);},0);
  var tMPBudget=projects.reduce(function(s,p){return s+(p.manpower_budget||0);},0);
  var tBudget=tProcBudget+tMPBudget;
  var tProcEst=items.reduce(function(s,i){return s+(i.cost||0);},0);
  var tProcComm=items.reduce(function(s,i){return s+(isCommitted(i.status)?(i.act_cost!=null?i.act_cost:i.cost):0);},0);
  var tMPAct=projects.reduce(function(s,p){return s+mpActCostForProject(manpower,p.id,rm);},0);
  var tMPEst=projects.reduce(function(s,p){return s+mpEstCostForProject(manpower,p.id,rm);},0);
  var tMPSpend=tMPAct>0?tMPAct:tMPEst;
  var tCommitted=tProcComm+tMPSpend;
  var deliv=items.filter(function(i){return i.status==='Delivered';}).length;
  var committedCt=items.filter(function(i){return isCommitted(i.status);}).length;
  var pct=tBudget?Math.min(100,Math.round((tCommitted/tBudget)*100)):0;
  var barCol=pct>100?'#EF4444':pct>85?'#F59E0B':'#34D399';
  var stageRows=STAGES.map(function(s){return{name:s,count:items.filter(function(i){return i.status===s;}).length};});

  var sCurveData=useMemo(function(){return buildSCurveData(items);},[items]);
  var eacData=useMemo(function(){return buildEACData(projects,items,manpower,props.manpowerTypes);},[projects,items,manpower,props.manpowerTypes]);
  var cfData=useMemo(function(){return buildCashFlowData(items);},[items]);
  var cfMaxV=useMemo(function(){return cfData.reduce(function(m,d){return Math.max(m,d.planned,d.committed);},1);},[cfData]);

  var cards=[
    {icon:'dollar',  label:'Total Budget',     value:fmt(tBudget,currency),    sub:projects.length+' projects · '+fmt(tProcBudget,currency)+' proc + '+fmt(tMPBudget,currency)+' MP', color:'#F59E0B'},
    {icon:'coins',   label:'Committed Spend',  value:fmt(tCommitted,currency), sub:pct+'% of budget · '+committedCt+' items committed',  color:'#3B82F6'},
    {icon:'package', label:'Procurement Items',value:items.length,             sub:committedCt+' committed · '+deliv+' delivered',       color:'#A78BFA'},
    {icon:'check',   label:'Delivery Rate',    value:(items.length?Math.round((deliv/items.length)*100):0)+'%', sub:deliv+' of '+items.length+' items delivered', color:'#34D399'},
  ];

  function WHead(id,title,icon,col){
    return <div style={{padding:'13px 18px',borderBottom:wVis[id]?'none':'1px solid var(--c-border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:28,height:28,borderRadius:7,background:col+'1a',display:'flex',alignItems:'center',justifyContent:'center'}}><Ico n={icon} size={13} color={col}/></div>
        <span style={{fontSize:13,fontWeight:700,color:'var(--c-text1)'}}>{title}</span>
      </div>
      <button onClick={function(){toggleW(id);}} title={wVis[id]?'Show':'Hide'}
        style={{background:'transparent',border:'none',padding:5,cursor:'pointer',color:wVis[id]?'var(--c-text5)':'var(--c-text4)',display:'flex',alignItems:'center',borderRadius:6}}>
        <Ico n={wVis[id]?'eyeoff':'eye'} size={14}/>
      </button>
    </div>;
  }

  return (
    <div style={{display:'flex',flexDirection:'column',gap:18}}>

      {/* ── Stat cards ── */}
      <div className='stat-grid-4' style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        {cards.map(function(c){return(
          <div key={c.label} style={{background:'var(--c-surface)',borderRadius:12,border:'1px solid var(--c-border)',padding:'18px 20px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:10.5,color:'var(--c-text4)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px'}}>{c.label}</span>
              <div style={{width:28,height:28,borderRadius:7,background:c.color+'18',display:'flex',alignItems:'center',justifyContent:'center'}}><Ico n={c.icon} size={13} color={c.color}/></div>
            </div>
            <div style={{fontSize:24,fontWeight:700,color:'var(--c-text1)',lineHeight:1}}>{c.value}</div>
            <div style={{fontSize:11,color:'var(--c-text5)',marginTop:5}}>{c.sub}</div>
          </div>
        );})}
      </div>

      {/* ── Widget 1: Budget Utilization ── */}
      <div style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:12,overflow:'hidden'}}>
        {WHead('util','Budget Utilization','dollar','#F59E0B')}
        {!wVis['util']&&(
          <div style={{padding:'16px 18px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
              <div>
                <div style={{fontSize:13.5,color:'var(--c-text2)'}}>{fmt(tCommitted,currency)} committed <span style={{color:'var(--c-text5)'}}>of {fmt(tBudget,currency)} budget</span></div>
                <div style={{fontSize:11,color:'var(--c-text5)',marginTop:2}}>Procurement est: {fmt(tProcEst,currency)} · Committed: {fmt(tProcComm,currency)}</div>
              </div>
              <span style={{fontSize:30,fontWeight:700,color:barCol,flexShrink:0}}>{pct}%</span>
            </div>
            {/* Procurement pool */}
            <div style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:11.5,color:'var(--c-text4)',fontWeight:600}}>Procurement Pool</span>
                <span style={{fontSize:11.5,color:'var(--c-text3)'}}>{fmt(tProcComm,currency)} committed / {fmt(tProcBudget,currency)} budget</span>
              </div>
              <div style={{position:'relative',height:10,background:'var(--c-bg)',borderRadius:999,overflow:'hidden',marginBottom:3}}>
                <div style={{position:'absolute',height:'100%',borderRadius:999,width:tProcBudget?Math.min(100,(tProcEst/tProcBudget)*100)+'%':'0%',background:'rgba(96,165,250,.18)'}}/>
                <div style={{position:'absolute',height:'100%',borderRadius:999,width:tProcBudget?Math.min(100,(tProcComm/tProcBudget)*100)+'%':'0%',background:'linear-gradient(90deg,#3B82F6cc,#3B82F6)'}}/>
              </div>
              <div style={{display:'flex',gap:14,fontSize:10.5,color:'var(--c-text5)'}}>
                <span><span style={{color:'rgba(96,165,250,.6)'}}>▬</span> Estimated {fmt(tProcEst,currency)}</span>
                <span><span style={{color:'#3B82F6'}}>▬</span> Committed {fmt(tProcComm,currency)}</span>
              </div>
            </div>
            {/* Manpower pool */}
            <div style={{marginBottom:18}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                <span style={{fontSize:11.5,color:'var(--c-text4)',fontWeight:600}}>Manpower Pool</span>
                <span style={{fontSize:11.5,color:'var(--c-text3)'}}>{fmt(tMPSpend,currency)} actual / {fmt(tMPBudget,currency)} budget</span>
              </div>
              <div style={{position:'relative',height:10,background:'var(--c-bg)',borderRadius:999,overflow:'hidden',marginBottom:3}}>
                <div style={{position:'absolute',height:'100%',borderRadius:999,width:tMPBudget?Math.min(100,(tMPEst/tMPBudget)*100)+'%':'0%',background:'rgba(167,139,250,.18)'}}/>
                <div style={{position:'absolute',height:'100%',borderRadius:999,width:tMPBudget?Math.min(100,(tMPSpend/tMPBudget)*100)+'%':'0%',background:'linear-gradient(90deg,'+MP_COLOR+'cc,'+MP_COLOR+')'}}/>
              </div>
              <div style={{display:'flex',gap:14,fontSize:10.5,color:'var(--c-text5)'}}>
                <span><span style={{color:'rgba(167,139,250,.5)'}}>▬</span> Estimated {fmt(tMPEst,currency)}</span>
                <span><span style={{color:MP_COLOR}}>▬</span> Actual {fmt(tMPSpend,currency)}</span>
              </div>
            </div>
            {/* Per-project rows */}
            <div style={{borderTop:'1px solid var(--c-border)',paddingTop:14}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--c-text5)',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:10}}>By Project</div>
              {projects.map(function(p){
                var procComm=procCommittedForProject(items,p.id);
                var mpAct=mpActCostForProject(manpower,p.id,rm),mpEst=mpEstCostForProject(manpower,p.id,rm);
                var mpS=mpAct>0?mpAct:mpEst;
                var totBudget=(p.budget||0)+(p.manpower_budget||0);
                var totComm=procComm+mpS;
                var pp=totBudget?Math.min(100,Math.round((totComm/totBudget)*100)):0;
                var over=totComm>totBudget;
                var procPct=p.budget?Math.min(100,Math.round((procComm/p.budget)*100)):0;
                var mpPct=p.manpower_budget?Math.min(100,Math.round((mpS/p.manpower_budget)*100)):0;
                return(<div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'7px 0',borderBottom:'1px solid var(--c-border)'}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:p.color,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
                      <span style={{fontSize:12.5,color:'var(--c-text2)',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</span>
                      {over&&<span style={{fontSize:9.5,color:'#F87171',background:'rgba(248,113,113,.1)',padding:'1px 5px',borderRadius:999,border:'1px solid rgba(248,113,113,.2)',whiteSpace:'nowrap',flexShrink:0}}>OVER BUDGET</span>}
                    </div>
                    <div style={{display:'flex',gap:4}}>
                      <div title="Procurement" style={{flex:p.budget||1,height:5,background:'var(--c-bg)',borderRadius:999,overflow:'hidden'}}>
                        <div style={{height:'100%',borderRadius:999,width:procPct+'%',background:'#3B82F6'}}/>
                      </div>
                      {p.manpower_budget>0&&<div title="Manpower" style={{flex:p.manpower_budget||1,height:5,background:'var(--c-bg)',borderRadius:999,overflow:'hidden'}}>
                        <div style={{height:'100%',borderRadius:999,width:mpPct+'%',background:MP_COLOR}}/>
                      </div>}
                    </div>
                  </div>
                  <div style={{textAlign:'right',flexShrink:0}}>
                    <div style={{fontSize:12.5,fontWeight:600,color:over?'#F87171':'var(--c-text2)'}}>{fmt(totComm,currency)}</div>
                    <div style={{fontSize:10.5,color:'var(--c-text5)'}}>{pp}% of {fmt(totBudget,currency)}</div>
                  </div>
                </div>);
              })}
            </div>
          </div>
        )}
      </div>

      {/* ── Widget 2: S-Curve Burn-Down ── */}
      <div style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:12,overflow:'hidden'}}>
        {WHead('scurve','Spend Burn-Down (S-Curve)','chartline','#60A5FA')}
        {!wVis['scurve']&&(
          <div style={{padding:'16px 18px'}}>
            <div style={{display:'flex',gap:20,marginBottom:12}}>
              <div style={{fontSize:12,color:'var(--c-text5)'}}>Cumulative planned vs committed spend over delivery schedule. Dashed = planned, solid = committed.</div>
            </div>
            {sCurveData.length<2
              ? <div style={{height:180,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--c-text5)',fontSize:12}}>Add procurement items with delivery dates to see the S-curve.</div>
              : <LineChart data={sCurveData} height={220} currency={currency}/>
            }
          </div>
        )}
      </div>

      {/* ── Widget 3: EAC ── */}
      <div style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:12,overflow:'hidden'}}>
        {WHead('eac','Forecast at Completion (EAC)','alert','#FBBF24')}
        {!wVis['eac']&&(
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',minWidth:720}}>
              <thead>
                <tr>{['Project','Proc Budget','Committed','MP Budget','MP Actual','Total Budget','EAC','Variance'].map(function(h){
                  return <th key={h} style={{padding:'10px 10px',fontSize:9.5,color:'var(--c-text5)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.5px',textAlign:h==='Project'?'left':'right',background:'var(--c-bg)',borderBottom:'1px solid var(--c-border)'}}>{h}</th>;
                })}</tr>
              </thead>
              <tbody>
                {eacData.map(function(p){
                  var vCol=p.variance<0?'#F87171':p.variance<p.totalBudget*.1?'#FBBF24':'#34D399';
                  return <tr key={p.id}>
                    <td style={{padding:'9px 10px',borderBottom:'1px solid var(--c-border)',fontSize:12.5}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <div style={{width:7,height:7,borderRadius:'50%',background:p.color}}/>
                        <span style={{color:'var(--c-text2)',fontWeight:500}}>{p.name}</span>
                        {p.overrun&&<span style={{fontSize:9,color:'#F87171',background:'rgba(248,113,113,.1)',padding:'1px 5px',borderRadius:999,border:'1px solid rgba(248,113,113,.25)'}}>OVERRUN</span>}
                      </div>
                    </td>
                    <td style={{padding:'9px 10px',borderBottom:'1px solid var(--c-border)',textAlign:'right',fontSize:12,color:'var(--c-text3)'}}>{fmt(p.procBudget,currency)}</td>
                    <td style={{padding:'9px 10px',borderBottom:'1px solid var(--c-border)',textAlign:'right',fontSize:12,color:'#60A5FA',fontWeight:600}}>{fmt(p.procComm,currency)}</td>
                    <td style={{padding:'9px 10px',borderBottom:'1px solid var(--c-border)',textAlign:'right',fontSize:12,color:'var(--c-text3)'}}>{fmt(p.mpBudget,currency)}</td>
                    <td style={{padding:'9px 10px',borderBottom:'1px solid var(--c-border)',textAlign:'right',fontSize:12,color:MP_COLOR}}>{fmt(p.mpEAC,currency)}</td>
                    <td style={{padding:'9px 10px',borderBottom:'1px solid var(--c-border)',textAlign:'right',fontSize:12.5,fontWeight:700,color:'var(--c-text2)'}}>{fmt(p.totalBudget,currency)}</td>
                    <td style={{padding:'9px 10px',borderBottom:'1px solid var(--c-border)',textAlign:'right',fontSize:12.5,fontWeight:700,color:p.overrun?'#F87171':'var(--c-text1)'}}>{fmt(p.totalEAC,currency)}</td>
                    <td style={{padding:'9px 10px',borderBottom:'1px solid var(--c-border)',textAlign:'right',fontSize:12,fontWeight:600,color:vCol}}>
                      {p.variance>=0?'+':''}{fmt(p.variance,currency)}
                    </td>
                  </tr>;
                })}
              </tbody>
              <tfoot>
                <tr style={{background:'var(--c-bg)'}}>
                  <td colSpan={5} style={{padding:'10px',fontSize:11,fontWeight:700,color:'var(--c-text5)',textTransform:'uppercase',letterSpacing:'.4px'}}>Portfolio Total</td>
                  <td style={{padding:'10px',textAlign:'right',fontSize:13,fontWeight:700,color:'var(--c-text2)'}}>{fmt(eacData.reduce(function(s,p){return s+p.totalBudget;},0),currency)}</td>
                  <td style={{padding:'10px',textAlign:'right',fontSize:13,fontWeight:700,color:eacData.some(function(p){return p.overrun;})?'#F87171':'#34D399'}}>{fmt(eacData.reduce(function(s,p){return s+p.totalEAC;},0),currency)}</td>
                  <td style={{padding:'10px',textAlign:'right',fontSize:12,fontWeight:600,color:(function(){var v=eacData.reduce(function(s,p){return s+p.variance;},0);return v>=0?'#34D399':'#F87171';})()}}>
                    {(function(){var v=eacData.reduce(function(s,p){return s+p.variance;},0);return(v>=0?'+':'')+fmt(v,currency);})()}
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        )}
      </div>

      {/* ── Widget 4: Cash Flow / Commitment View ── */}
      <div style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:12,overflow:'hidden'}}>
        {WHead('cashflow','Commitment / Cash Flow','calendar','#A78BFA')}
        {!wVis['cashflow']&&(
          <div style={{padding:'16px 18px'}}>
            {!cfData.length
              ? <div style={{height:100,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--c-text5)',fontSize:12}}>No items with delivery dates yet.</div>
              : <div>
                  <div style={{overflowX:'auto',paddingBottom:8}}>
                    <div style={{display:'flex',gap:12,minWidth:'max-content',alignItems:'flex-end',paddingBottom:4}}>
                      {cfData.map(function(m){
                        var d=new Date(m.month+'-01');
                        var label=d.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
                        var planH=Math.max(6,Math.round((m.planned/cfMaxV)*110));
                        var commH=m.committed>0?Math.max(6,Math.round((m.committed/cfMaxV)*110)):0;
                        var over=m.committed>m.planned;
                        return <div key={m.month} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,minWidth:70}}>
                          <div style={{fontSize:9.5,color:'var(--c-text5)',textAlign:'center'}}>{fmt(m.planned,currency)}</div>
                          <div style={{display:'flex',gap:5,alignItems:'flex-end',height:120}}>
                            <div title="Planned" style={{width:22,background:'rgba(96,165,250,.2)',borderRadius:'3px 3px 0 0',height:planH+'px',border:'1px solid rgba(96,165,250,.35)'}}/>
                            {commH>0&&<div title="Committed" style={{width:22,background:over?'rgba(248,113,113,.45)':'rgba(52,211,153,.35)',borderRadius:'3px 3px 0 0',height:commH+'px',border:'1px solid '+(over?'rgba(248,113,113,.55)':'rgba(52,211,153,.45)')}}/>}
                          </div>
                          <div style={{fontSize:10.5,fontWeight:600,color:'var(--c-text4)',textAlign:'center'}}>{label}</div>
                          {commH>0&&<div style={{fontSize:9,color:over?'#F87171':'#34D399',textAlign:'center'}}>{fmt(m.committed,currency)}</div>}
                        </div>;
                      })}
                    </div>
                  </div>
                  <div style={{display:'flex',gap:18,marginTop:4}}>
                    <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--c-text5)'}}>
                      <div style={{width:12,height:12,borderRadius:2,background:'rgba(96,165,250,.2)',border:'1px solid rgba(96,165,250,.35)'}}/>Planned
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--c-text5)'}}>
                      <div style={{width:12,height:12,borderRadius:2,background:'rgba(52,211,153,.35)',border:'1px solid rgba(52,211,153,.45)'}}/>Committed
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:6,fontSize:11,color:'var(--c-text5)'}}>
                      <div style={{width:12,height:12,borderRadius:2,background:'rgba(248,113,113,.45)',border:'1px solid rgba(248,113,113,.55)'}}/>Over Planned
                    </div>
                  </div>
                  {/* Pipeline summary */}
                  <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid var(--c-border)',display:'flex',gap:18,flexWrap:'wrap'}}>
                    {stageRows.map(function(row){var cfg=SC[row.name];return <div key={row.name} style={{display:'flex',alignItems:'center',gap:8}}>
                      <div style={{width:8,height:8,borderRadius:'50%',background:cfg.color}}/>
                      <span style={{fontSize:12,color:cfg.color,fontWeight:600}}>{row.count}</span>
                      <span style={{fontSize:11.5,color:'var(--c-text5)'}}>{row.name}</span>
                    </div>;})}
                    <div style={{marginLeft:'auto',fontSize:11,color:'var(--c-text5)'}}>Overall delivery: <strong style={{color:'#34D399'}}>{items.length?Math.round((deliv/items.length)*100):0}%</strong></div>
                  </div>
                </div>
            }
          </div>
        )}
      </div>

    </div>
  );
}

/* ── Projects List ──────────────────────────────────────────── */
function ProjectsList(props) {
  var projects=props.projects,items=props.items,currency=props.currency,rates=props.rates,manpower=props.manpower||[],onSelect=props.onSelect,onEdit=props.onEdit,onDelete=props.onDelete;
  var rm=useMemo(function(){return mpRatesMap(props.manpowerTypes||DEMO_MANPOWER_TYPES);},[props.manpowerTypes]);
  var stats=useMemo(function(){return projects.map(function(p){
    var pi=items.filter(function(i){return i.projectId===p.id;});
    var projCur=p.currency||currency;
    var hasMixed=pi.some(function(i){return i.item_currency&&i.item_currency!==projCur;});
    var procComm=procCommittedForProject(items,p.id);
    var procEst=procEstForProject(items,p.id);
    var convertedComm=hasMixed&&rates?pi.filter(function(i){return isCommitted(i.status);}).reduce(function(s,i){var ic=i.item_currency||projCur,c=i.act_cost!=null?i.act_cost:i.cost;return s+((rates[ic]&&rates[projCur])?convert(c,ic,projCur,rates):c);},0):null;
    var procCommDisplay=convertedComm!=null?convertedComm:procComm;
    var mpAct=mpActCostForProject(manpower,p.id,rm);
    var mpEst=mpEstCostForProject(manpower,p.id,rm);
    var mpSpend=mpAct>0?mpAct:mpEst;
