    var totalCommitted=procCommDisplay+mpSpend;
    var totalBudget=(p.budget||0)+(p.manpower_budget||0);
    var procPct=p.budget?Math.min(100,Math.round((procCommDisplay/p.budget)*100)):0;
    var mpPct=p.manpower_budget?Math.min(100,Math.round((mpSpend/p.manpower_budget)*100)):0;
    var pct=totalBudget?Math.min(110,Math.round((totalCommitted/totalBudget)*100)):0;
    var sc={};STAGES.forEach(function(s){sc[s]=pi.filter(function(i){return i.status===s;}).length;});
    return Object.assign({},p,{procComm:procCommDisplay,procEst:procEst,hasMixed:hasMixed,totalCommitted:totalCommitted,pct:pct,procPct:procPct,mpPct:mpPct,sc:sc,mpSpend:mpSpend,totalBudget:totalBudget,over:totalCommitted>totalBudget});
  });},[projects,items,rates,currency,manpower,rm]);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      <div style={{fontSize:12,color:'var(--c-text5)'}}>{projects.length} project{projects.length!==1?'s':''} · {items.length} equipment items total</div>
      {!projects.length&&<div style={{background:'var(--c-surface)',border:'1px dashed #334155',borderRadius:14,padding:'50px 20px',textAlign:'center',color:'var(--c-text5)',fontSize:13}}>No projects yet. Click <strong style={{color:'#F59E0B'}}>New Project</strong> to get started.</div>}
      <div className='proj-grid' style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:14}}>
        {stats.map(function(p){return(
          <div key={p.id} style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:14,overflow:'hidden',transition:'border-color .15s'}}
            onMouseEnter={function(e){e.currentTarget.style.borderColor=p.color+'55';}}
            onMouseLeave={function(e){e.currentTarget.style.borderColor='var(--c-border)';}}>
            <div style={{height:3,background:p.color}}/>
            <div style={{padding:'16px 16px 14px'}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
                <div style={{flex:1,minWidth:0,marginRight:10}}>
                  <div style={{fontSize:14,fontWeight:700,color:'var(--c-text1)',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                  <div style={{fontSize:11.5,color:'var(--c-text5)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.description||'No description'}</div>
                </div>
                <div style={{display:'flex',gap:5,flexShrink:0}}>
                  <button onClick={function(e){e.stopPropagation();onEdit(p);}} style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:6,padding:'4px 7px',color:'#60A5FA',display:'flex'}}><Ico n="edit" size={11}/></button>
                  <button onClick={function(e){e.stopPropagation();onDelete(p.id);}} style={{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.2)',borderRadius:6,padding:'4px 7px',color:'#F87171',display:'flex'}}><Ico n="trash" size={11}/></button>
                </div>
              </div>
              <div style={{marginBottom:12}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                  <span style={{fontSize:11,color:'var(--c-text5)'}}>Committed</span>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    {p.over&&<span style={{fontSize:9.5,color:'#F87171',background:'rgba(248,113,113,.1)',padding:'1px 5px',borderRadius:999,border:'1px solid rgba(248,113,113,.2)'}}>OVER</span>}
                    <span style={{fontSize:11,color:p.over?'#F87171':'var(--c-text3)'}}>{fmt(p.totalCommitted,p.currency||currency)} / {fmt(p.totalBudget,p.currency||currency)}</span>
                  </div>
                </div>
                {p.hasMixed&&<div style={{fontSize:10,color:'#F59E0B',textAlign:'right',marginBottom:2}}>≈ converted to {p.currency||currency}</div>}
                <div style={{display:'flex',gap:3,marginBottom:4}}>
                  <div title="Procurement" style={{flex:Math.max(1,p.budget||0),height:5,background:'var(--c-bg)',borderRadius:999,overflow:'hidden'}}>
                    <div style={{height:'100%',borderRadius:999,width:p.procPct+'%',background:p.procPct>100?'#EF4444':p.color}}/>
                  </div>
                  {p.manpower_budget>0&&<div title="Manpower" style={{flex:Math.max(1,p.manpower_budget||0),height:5,background:'var(--c-bg)',borderRadius:999,overflow:'hidden'}}>
                    <div style={{height:'100%',borderRadius:999,width:p.mpPct+'%',background:p.mpPct>100?'#EF4444':MP_COLOR}}/>
                  </div>}
                </div>
                <div style={{display:'flex',gap:10,fontSize:10,color:'var(--c-text5)'}}>
                  <span>Proc: {fmt(p.procComm,p.currency||currency)}</span>
                  {p.mpSpend>0&&<span style={{color:MP_COLOR}}>MP: {fmt(p.mpSpend,p.currency||currency)}</span>}
                  <span style={{marginLeft:'auto'}}>{p.pct}%</span>
                </div>
              </div>
              <div style={{display:'flex',gap:5,marginBottom:14,flexWrap:'wrap'}}>
                {STAGES.map(function(s){var cnt=p.sc[s]||0,cfg=SC[s];return(<div key={s} style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px',borderRadius:999,background:cfg.bg,border:'1px solid '+cfg.color+'25'}}><span style={{fontSize:9.5,fontWeight:700,color:cfg.color,textTransform:'uppercase',letterSpacing:'.4px'}}>{s}</span><span style={{fontSize:11.5,fontWeight:700,color:cfg.color}}>{cnt}</span></div>);})}
              </div>
              <button onClick={function(){onSelect(p.id);}} style={{width:'100%',padding:'9px',background:p.color+'14',border:'1px solid '+p.color+'28',borderRadius:8,color:p.color,fontSize:12.5,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                View Project <Ico n="chevr" size={13}/>
              </button>
            </div>
          </div>
        );})}
      </div>
    </div>
  );
}

/* ── Kanban ─────────────────────────────────────────────────── */
function Kanban(props) {
  var project=props.project,items=props.items,categories=props.categories,currency=props.currency,rates=props.rates;
  var onBack=props.onBack,onAdd=props.onAdd,onEdit=props.onEdit,onDelete=props.onDelete,onMove=props.onMove;
  var manpower=props.manpower||[],onAddManpower=props.onAddManpower,onDeleteManpower=props.onDeleteManpower;
  var manpowerTypes=props.manpowerTypes||DEMO_MANPOWER_TYPES;
  var rm=useMemo(function(){return mpRatesMap(manpowerTypes);},[manpowerTypes]);
  var _s=useState(''),search=_s[0],setSearch=_s[1];
  var _vt=useState('equipment'),viewTab=_vt[0],setViewTab=_vt[1];
  var pi=useMemo(function(){var q=search.toLowerCase();return items.filter(function(i){return i.projectId===project.id&&(!q||i.name.toLowerCase().includes(q)||i.vendor.toLowerCase().includes(q));});},[items,project.id,search]);
  var allPi=items.filter(function(i){return i.projectId===project.id;});
  var procEst=allPi.reduce(function(s,i){return s+(i.cost||0);},0);
  var procComm=procCommittedForProject(items,project.id);
  var hasMixedCur=allPi.some(function(i){return i.item_currency&&i.item_currency!==currency;});
  var mpEstC=mpEstCostForProject(manpower,project.id,rm);
  var mpActC=mpActCostForProject(manpower,project.id,rm);
  var mpSpend=mpActC>0?mpActC:mpEstC;
  var totalCommitted=procComm+mpSpend;
  var totalEst=procEst+mpEstC;
  var totalBudget=(project.budget||0)+(project.manpower_budget||0);
  var pct=Math.min(100,Math.round((totalCommitted/Math.max(1,totalBudget))*100));
  var pctEst=Math.min(100,Math.round((totalEst/Math.max(1,totalBudget))*100));
  var deliv=allPi.filter(function(i){return i.status==='Delivered';}).length;
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div>
        <button onClick={onBack} style={{background:'none',border:'none',color:'var(--c-text5)',fontSize:12.5,display:'flex',alignItems:'center',gap:5,padding:'0 0 10px',cursor:'pointer'}}><Ico n="chevl" size={13}/> All Projects</button>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:project.color}}/>
            <div><h2 style={{margin:0,fontSize:17,fontWeight:700,color:'var(--c-text1)'}}>{project.name}</h2><div style={{fontSize:12,color:'var(--c-text5)'}}>{project.description}</div></div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {viewTab==='equipment'&&<div style={{position:'relative'}}>
              <div style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',display:'flex'}}><Ico n="search" size={13} color="#475569"/></div>
              <input value={search} onChange={function(e){setSearch(e.target.value);}} placeholder="Search equipment…" style={{paddingLeft:28,paddingRight:10,paddingTop:7,paddingBottom:7,background:'var(--c-surface)',border:'1px solid var(--c-border2)',borderRadius:7,color:'var(--c-text2)',fontSize:12.5,width:180}}/>
            </div>}
            {viewTab==='equipment'&&<button onClick={function(){onAdd('Creation');}} style={{background:'#F59E0B',border:'none',borderRadius:8,padding:'8px 14px',color:'#000',fontWeight:700,fontSize:12.5,display:'flex',alignItems:'center',gap:5}}><Ico n="plus" size={13}/> Add Equipment</button>}
          </div>
        </div>
      </div>
      <div className='stat-grid-4' style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(155px,1fr))',gap:10}}>
        {[
          {label:'Total Budget',   value:fmt(totalBudget,currency),  sub:project.manpower_budget>0?fmt(project.budget||0,currency)+' proc + '+fmt(project.manpower_budget,currency)+' MP':'Allocated', col:'#F59E0B'},
          {label:'Proc Committed', value:fmt(procComm,currency),     sub:procEst>procComm?'Est: '+fmt(procEst,currency):'Fully committed',                                                             col:'#3B82F6'},
          {label:'Manpower',       value:fmt(mpSpend,currency),      sub:mpActC>0?'actual cost':'estimated cost',                                                                                     col:MP_COLOR},
          {label:'Items',          value:allPi.length,               sub:(allPi.filter(function(i){return isCommitted(i.status);}).length)+' committed · '+deliv+' delivered',                        col:'#A78BFA'},
          {label:'Committed %',    value:pct+'%',                    sub:'of '+fmt(totalBudget,currency)+' budget',                                                                                    col:pct>100?'#EF4444':pct>85?'#F59E0B':'#34D399'},
          {label:'Delivery Rate',  value:(allPi.length?Math.round((deliv/allPi.length)*100):0)+'%', sub:deliv+' of '+allPi.length+' items',                                                          col:'#34D399'},
        ].map(function(r){return(<div key={r.label} style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:10,padding:'12px 14px'}}><div style={{fontSize:10,color:'var(--c-text4)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>{r.label}</div><div style={{fontSize:18,fontWeight:700,color:r.col,lineHeight:1}}>{r.value}</div><div style={{fontSize:10.5,color:'var(--c-text5)',marginTop:3}}>{r.sub}</div></div>);})}
      </div>
      <div style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:10,padding:'11px 16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <span style={{fontSize:11,color:'var(--c-text4)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px'}}>Budget Utilization — Committed vs Estimated vs Budget</span>
          <span style={{fontSize:12,fontWeight:600,color:pct>100?'#EF4444':pct>85?'#F59E0B':'#34D399'}}>{pct}%</span>
        </div>
        {/* Procurement pool */}
        <div style={{marginBottom:6}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--c-text5)',marginBottom:3}}>
            <span>Procurement</span><span>{fmt(procComm,currency)} committed · {fmt(project.budget||0,currency)} budget</span>
          </div>
          <div style={{height:7,background:'var(--c-bg)',borderRadius:999,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',height:'100%',borderRadius:999,width:project.budget?Math.min(100,(procEst/(project.budget||1))*100)+'%':'0%',background:'rgba(59,130,246,.18)'}}/>
            <div style={{position:'absolute',height:'100%',borderRadius:999,width:project.budget?Math.min(100,(procComm/(project.budget||1))*100)+'%':'0%',background:project.color}}/>
          </div>
        </div>
        {/* Manpower pool */}
        {project.manpower_budget>0&&<div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--c-text5)',marginBottom:3}}>
            <span>Manpower</span><span>{fmt(mpSpend,currency)} {mpActC>0?'actual':'estimated'} · {fmt(project.manpower_budget,currency)} budget</span>
          </div>
          <div style={{height:7,background:'var(--c-bg)',borderRadius:999,overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:999,width:project.manpower_budget?Math.min(100,(mpSpend/(project.manpower_budget||1))*100)+'%':'0%',background:MP_COLOR}}/>
          </div>
        </div>}
        <div style={{display:'flex',gap:14,marginTop:6,fontSize:10,color:'var(--c-text5)'}}>
          <span><span style={{color:'rgba(59,130,246,.4)'}}>▬</span> Est. {fmt(procEst,currency)}</span>
          <span><span style={{color:project.color}}>▬</span> Committed {fmt(procComm,currency)}</span>
          {mpSpend>0&&<span><span style={{color:MP_COLOR}}>▬</span> Manpower {fmt(mpSpend,currency)}</span>}
        </div>
      </div>

      {/* ── Tab bar ── */}
      <div style={{display:'flex',background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:10,padding:4,gap:4}}>
        {[
          {id:'equipment',icon:'package',label:'Equipment',count:allPi.length},
          {id:'manpower', icon:'people', label:'Manpower', count:manpower.filter(function(m){return m.projectId===project.id;}).length},
        ].map(function(t){
          var act=viewTab===t.id;
          return (
            <button key={t.id} onClick={function(){setViewTab(t.id);}}
              style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:7,padding:'8px 14px',borderRadius:7,border:'none',cursor:'pointer',
                background:act?project.color+'18':'transparent',
                color:act?project.color:'var(--c-text4)',
                fontWeight:act?700:400,fontSize:13,transition:'all .15s'}}>
              <Ico n={t.icon} size={14}/>
              {t.label}
              <span style={{fontSize:11,fontWeight:700,padding:'1px 7px',borderRadius:999,
                background:act?project.color+'25':'var(--c-bg)',
                color:act?project.color:'var(--c-text5)',
                border:'1px solid '+(act?project.color+'30':'var(--c-border2)')
              }}>{t.count}</span>
            </button>
          );
        })}
      </div>

      {viewTab==='equipment'&&<div className='stat-grid-4' style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
        {STAGES.map(function(stage,si){

          var col=pi.filter(function(i){return i.status===stage;}),cfg=SC[stage];
          return(<div key={stage} className='kanban-col' style={{background:'var(--c-kanban)',border:'1px solid var(--c-border)',borderRadius:12,display:'flex',flexDirection:'column',minHeight:280}}>
            <div style={{padding:'11px 12px 9px',borderBottom:'2px solid '+cfg.color+'35',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
              <div style={{display:'flex',alignItems:'center',gap:6}}><span style={{width:7,height:7,borderRadius:'50%',background:cfg.color}}/><span style={{fontSize:11,fontWeight:700,color:cfg.color,textTransform:'uppercase',letterSpacing:'.6px'}}>{stage}</span></div>
              <span style={{fontSize:11,fontWeight:700,color:cfg.color,background:cfg.bg,padding:'1px 7px',borderRadius:999}}>{col.length}</span>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:8}}>
              {!col.length&&<div style={{textAlign:'center',padding:'22px 8px',color:'var(--c-ghost)',fontSize:12,border:'1px dashed #1E3A5F',borderRadius:8,marginTop:4}}>No items</div>}
              {col.map(function(item){
                var orderBy   = item.order_by_date || calcOrderBy(item.delivery_date||item.deadline, item.lead_time_days);
                var urgency   = urgencyLabel(orderBy, item.status);
                var itemCur   = item.item_currency || currency;
                var estCost = item.cost || ((item.qty||1)*(item.unit_cost||0));
                var actCost = item.act_cost;
                var totalCost = estCost;
                var convertedCost = (itemCur!==currency&&rates&&rates[itemCur]&&rates[currency])?convert(actCost!=null?actCost:estCost,itemCur,currency,rates):null;
                return(
                <div key={item.id} style={{background:'var(--c-surface)',border:'1px solid var(--c-border)',borderRadius:10,padding:'10px 10px 8px',marginBottom:8}}>
                  {/* Name */}
                  <div style={{fontSize:12.5,fontWeight:600,color:'var(--c-text2)',marginBottom:2,lineHeight:1.35}}>{item.name}</div>
                  <div style={{fontSize:11,color:'var(--c-text5)',marginBottom:8}}>{item.vendor}</div>

                  {/* Cost breakdown */}
                  <div style={{background:'var(--c-bg)',borderRadius:6,padding:'7px 9px',marginBottom:8}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontSize:10.5,color:'var(--c-text5)'}}>{item.qty>1?item.qty+' × '+fmt(item.unit_cost||0,itemCur):item.category}</span>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontSize:13,fontWeight:700,color:actCost!=null&&isCommitted(item.status)?'#60A5FA':'var(--c-text2)'}}>{fmt(actCost!=null&&isCommitted(item.status)?actCost:estCost,itemCur)}</div>
                        {actCost!=null&&isCommitted(item.status)&&actCost!==estCost&&<div style={{fontSize:9.5,color:'var(--c-text5)',textDecoration:'line-through'}}>{fmt(estCost,itemCur)} est.</div>}
                      </div>
                    </div>
                    {actCost!=null&&isCommitted(item.status)&&<div style={{fontSize:9.5,color:'#60A5FA',marginTop:2}}>Committed PO amount</div>}
                    {item.qty>1&&<div style={{fontSize:10,color:'var(--c-ghost)',marginTop:2}}>{item.category}</div>}
                    {itemCur!==currency&&(convertedCost!=null
                      ?<div style={{fontSize:10.5,color:'#F59E0B',marginTop:3,fontWeight:500}}>≈ {fmt(convertedCost,currency)}</div>
                      :<div style={{fontSize:10,color:'var(--c-ghost)',marginTop:2}}>{itemCur} · project: {currency}</div>
                    )}
                  </div>

                  {/* Dates block */}
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5,marginBottom:urgency.fulfilled?6:8}}>
                    {/* Order by — green when fulfilled */}
                    <div style={{background:urgency.color+'12',borderRadius:6,padding:'5px 8px',border:'1px solid '+urgency.color+(urgency.fulfilled?'55':'25')}}>
                      <div style={{fontSize:9,color:urgency.color,fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',marginBottom:2}}>Order By</div>
                      <div style={{fontSize:11.5,fontWeight:600,color:urgency.color}}>{orderBy||'—'}</div>
                    </div>
                    {/* Delivery */}
                    <div style={{background:'rgba(96,165,250,.06)',borderRadius:6,padding:'5px 8px',border:'1px solid rgba(96,165,250,.15)'}}>
                      <div style={{fontSize:9,color:'#60A5FA',fontWeight:700,textTransform:'uppercase',letterSpacing:'.4px',marginBottom:2}}>Delivery</div>
                      <div style={{fontSize:11.5,fontWeight:600,color:'var(--c-text3)'}}>{item.delivery_date||item.deadline||'—'}</div>
                    </div>
                  </div>
                  {urgency.fulfilled&&<div style={{fontSize:10,color:'#34D399',marginBottom:6,display:'flex',alignItems:'center',gap:4}}><span style={{width:5,height:5,borderRadius:'50%',background:'#34D399'}}/>Ordered &amp; fulfilled on time</div>}
                  {item.lead_time_days&&!urgency.fulfilled&&<div style={{fontSize:10.5,color:'var(--c-ghost)',marginBottom:8}}>Lead time: {item.lead_time_days} day{item.lead_time_days!==1?'s':''}</div>}

                  {/* Notes */}
                  {item.notes&&<div style={{fontSize:11,color:'var(--c-text5)',background:'var(--c-bg)',borderRadius:5,padding:'5px 8px',marginBottom:8,borderLeft:'2px solid var(--c-border2)',lineHeight:1.5,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{item.notes}</div>}

                  {/* Stage move + Edit/Delete */}
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                    <div style={{display:'flex',gap:4}}>
                      {si>0&&<button onClick={function(){onMove(item.id,STAGES[si-1]);}} style={{background:'rgba(148,163,184,.08)',border:'1px solid var(--c-border2)',borderRadius:5,padding:'3px 7px',color:'var(--c-text4)',display:'flex',alignItems:'center',gap:3,fontSize:10.5}}><Ico n="arrl" size={10}/>{STAGES[si-1]}</button>}
                      {si<STAGES.length-1&&<button onClick={function(){onMove(item.id,STAGES[si+1]);}} style={{background:cfg.bg,border:'1px solid '+cfg.color+'28',borderRadius:5,padding:'3px 7px',color:cfg.color,display:'flex',alignItems:'center',gap:3,fontSize:10.5}}>{STAGES[si+1]}<Ico n="arrr" size={10}/></button>}
                    </div>
                    <div style={{display:'flex',gap:4}}>
                      <button onClick={function(){onEdit(item);}} style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:5,padding:'3px 6px',color:'#60A5FA',display:'flex'}}><Ico n="edit" size={10}/></button>
                      <button onClick={function(){onDelete(item.id);}} style={{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.2)',borderRadius:5,padding:'3px 6px',color:'#F87171',display:'flex'}}><Ico n="trash" size={10}/></button>
                    </div>
                  </div>
                  {/* Pipeline dots */}
                  <div style={{paddingTop:7,borderTop:'1px solid var(--c-border)'}}><PipeDots stage={item.status}/></div>
                </div>
              );})}
            </div>
            <div style={{padding:8,borderTop:'1px solid var(--c-border)',flexShrink:0}}>
              <button onClick={function(){onAdd(stage);}} style={{width:'100%',padding:'6px',background:'transparent',border:'1px dashed #1E3A5F',borderRadius:7,color:'var(--c-ghost)',fontSize:11.5,display:'flex',alignItems:'center',justifyContent:'center',gap:4,transition:'all .15s'}}
                onMouseEnter={function(e){e.currentTarget.style.borderColor=cfg.color+'60';e.currentTarget.style.color=cfg.color;}}
                onMouseLeave={function(e){e.currentTarget.style.borderColor='var(--c-border)';e.currentTarget.style.color='var(--c-ghost)';}}>
                <Ico n="plus" size={11}/> Add here
              </button>
            </div>
          </div>);
        })}
      </div>}

      {viewTab==='manpower'&&<ManpowerTab
        project={project}
        manpower={manpower}
        manpowerTypes={manpowerTypes}
        onSave={onAddManpower}
        onDelete={onDeleteManpower}
      />}
    </div>
  );
}

/* ── Manpower Types Settings ─────────────────────────────────── */
function ManpowerTypesSettings(props) {
  var types=props.types||[], onAdd=props.onAdd, onUpdate=props.onUpdate, onDelete=props.onDelete, onToast=props.onToast;
  var _nName=useState(''),nName=_nName[0],setNName=_nName[1];
  var _nRate=useState(''),nRate=_nRate[0],setNRate=_nRate[1];
  var _editId=useState(null),editId=_editId[0],setEditId=_editId[1];
  var _editForm=useState({}),editForm=_editForm[0],setEditForm=_editForm[1];

  var INP2={background:'var(--c-input)',border:'1px solid var(--c-border2)',borderRadius:6,padding:'6px 10px',color:'var(--c-text2)',fontSize:13,width:'100%'};
  var TH={padding:'8px 12px',textAlign:'left',fontSize:10,color:'var(--c-text5)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px',background:'var(--c-bg)'};

  async function add(){
    var n=nName.trim(), r=parseFloat(nRate);
    if(!n){onToast('Name is required','warning');return;}
    if(isNaN(r)||r<0){onToast('Rate must be a valid number','warning');return;}
    if(types.find(function(t){return t.name.toLowerCase()===n.toLowerCase();})){onToast('Type already exists','warning');return;}
    await onAdd({name:n,rate_per_day:r});
    setNName('');setNRate('');
    onToast('Manpower type "'+n+'" added');
  }

  async function saveEdit(t){
    var n=(editForm.name!==undefined?editForm.name:t.name).trim();
    var r=parseFloat(editForm.rate_per_day!==undefined?editForm.rate_per_day:t.rate_per_day);
    if(!n){onToast('Name is required','warning');return;}
    if(isNaN(r)||r<0){onToast('Rate must be a valid number','warning');return;}
    await onUpdate(Object.assign({},t,{name:n,rate_per_day:r}));
    setEditId(null);setEditForm({});
    onToast('Manpower type updated');
  }

  return (
    <div>
      <div style={{fontSize:14,fontWeight:600,color:'var(--c-text1)',display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
        <Ico n="users" size={14} color={MP_COLOR}/> Manpower Types
      </div>
      <p style={{fontSize:12,color:'var(--c-text5)',marginBottom:14}}>Define the roles and their daily rates used in the Manpower plan.</p>
      <div style={{border:'1px solid var(--c-border)',borderRadius:9,overflow:'hidden',marginBottom:16}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr>
              {['Role / Type','Rate / Day (USD)','Actions'].map(function(h){return <th key={h} style={TH}>{h}</th>;})}
            </tr>
          </thead>
          <tbody>
            {types.map(function(t,idx){
              var isEdit=editId===t.id;
              return (
                <tr key={t.id} style={{borderTop:idx>0?'1px solid var(--c-border)':'none'}}>
                  <td style={{padding:'9px 12px'}}>
                    {isEdit
                      ? <input style={Object.assign({},INP2,{width:180})} value={editForm.name!==undefined?editForm.name:t.name} onChange={function(e){setEditForm(function(f){return Object.assign({},f,{name:e.target.value});});}}/>
                      : <span style={{fontSize:13,fontWeight:600,color:'var(--c-text2)'}}>{t.name}</span>}
                  </td>
                  <td style={{padding:'9px 12px'}}>
                    {isEdit
                      ? <input type="number" min="0" step="1" style={Object.assign({},INP2,{width:110})} value={editForm.rate_per_day!==undefined?editForm.rate_per_day:t.rate_per_day} onChange={function(e){setEditForm(function(f){return Object.assign({},f,{rate_per_day:e.target.value});});}}/>
                      : <span style={{fontSize:13,color:MP_COLOR,fontWeight:700}}>${(t.rate_per_day||0).toLocaleString()}/day</span>}
                  </td>
                  <td style={{padding:'9px 12px'}}>
                    <div style={{display:'flex',gap:6}}>
                      {isEdit
                        ? <>
                            <button onClick={function(){saveEdit(t);}} style={{background:'rgba(52,211,153,.12)',border:'1px solid rgba(52,211,153,.25)',borderRadius:6,padding:'4px 11px',color:'#34D399',fontSize:12,cursor:'pointer'}}>Save</button>
                            <button onClick={function(){setEditId(null);setEditForm({});}} style={{background:'none',border:'1px solid var(--c-border2)',borderRadius:6,padding:'4px 11px',color:'var(--c-text5)',fontSize:12,cursor:'pointer'}}>Cancel</button>
                          </>
                        : <>
                            <button onClick={function(){setEditId(t.id);setEditForm({});}} style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:6,padding:'4px 9px',color:'#60A5FA',fontSize:12,cursor:'pointer'}}>Edit</button>
                            <button onClick={function(){if(window.confirm('Remove "'+t.name+'"?'))onDelete(t.id);}} style={{background:'rgba(248,113,113,.08)',border:'1px solid rgba(248,113,113,.18)',borderRadius:6,padding:'4px 9px',color:'#F87171',fontSize:12,cursor:'pointer'}}>Delete</button>
                          </>}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {/* Add new type row */}
      <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
        <div style={{flex:2}}>
          <div style={{fontSize:11,color:'var(--c-text5)',marginBottom:4}}>Role Name</div>
          <input style={INP2} placeholder="e.g. Site Supervisor" value={nName} onChange={function(e){setNName(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')add();}}/>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:11,color:'var(--c-text5)',marginBottom:4}}>Rate/Day (USD)</div>
          <input type="number" min="0" step="1" style={INP2} placeholder="e.g. 450" value={nRate} onChange={function(e){setNRate(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')add();}}/>
        </div>
        <button onClick={add} style={{padding:'8px 16px',background:'rgba(167,139,250,.12)',border:'1px solid rgba(167,139,250,.25)',borderRadius:8,color:MP_COLOR,fontSize:13,display:'flex',alignItems:'center',gap:6,cursor:'pointer',whiteSpace:'nowrap'}}>
          <Ico n="plus" size={13}/> Add Type
        </button>
      </div>
    </div>
  );
}

/* ── Settings ───────────────────────────────────────────────── */

    onToast('Currency '+code+' added');

  async function saveEdit(c){
    await onUpdateCurrency(Object.assign({},c,editForm));
    setEditId(null);setEditForm({});

  }

  async function refreshRates(){
    setRLoading(true);

  var TH={padding:'8px 12px',textAlign:'left',fontSize:10,color:'var(--c-text5)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px',background:'var(--c-bg)'};

  return (

      {/* ── Currency Manager ── */}

        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>

            <Ico n="globe" size={14} color="#F59E0B"/> Currency Manager

            style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:7,padding:'5px 11px',color:'#60A5FA',fontSize:12,display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}>
            <Ico n="refresh" size={12}/>{rLoading?'Refreshing…':'Refresh Rates'}
          </button>
        </div>
        {ratesUpdated&&<p style={{fontSize:11,color:'var(--c-text5)',marginBottom:10}}>Live rates via exchangerate-api.com · Updated: {ratesUpdated}</p>}

          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:14,padding:'10px 12px',background:'var(--c-bg)',borderRadius:8,border:'1px solid var(--c-border)'}}>

        {/* Currency table */}
        <div style={{border:'1px solid var(--c-border)',borderRadius:9,overflow:'hidden',marginBottom:16}}>

                })}
              </tr>
            </thead>
            <tbody>
              {currencies.map(function(c,idx){
                var isEdit = editId === c.id;
                var rate = rates && rates[c.code] ? rates[c.code].toFixed(c.code==='JPY'?2:4) : '—';
                return (
                  <tr key={c.id} style={{borderTop:idx>0?'1px solid var(--c-border)':'none',background:c.is_active===false?'rgba(248,113,113,.03)':'transparent'}}>
                    <td style={{padding:'9px 12px'}}>
                      <span style={{fontSize:13,fontWeight:700,color:'#F59E0B',fontFamily:'monospace'}}>{c.code}</span>
                    </td>
                    <td style={{padding:'9px 12px'}}>
                      {isEdit
                        ? <input style={Object.assign({},INP,{padding:'5px 8px',fontSize:12.5,width:140})} value={editForm.name!==undefined?editForm.name:c.name} onChange={function(e){setEditForm(function(f){return Object.assign({},f,{name:e.target.value});});}}/>
                        : <span style={{fontSize:12.5,color:'var(--c-text2)'}}>{c.name}</span>}
                    </td>
                    <td style={{padding:'9px 12px'}}>
                      {isEdit
                        ? <input style={Object.assign({},INP,{padding:'5px 8px',fontSize:12.5,width:60})} value={editForm.symbol!==undefined?editForm.symbol:c.symbol} onChange={function(e){setEditForm(function(f){return Object.assign({},f,{symbol:e.target.value});});}}/>
                        : <span style={{fontSize:13,fontWeight:600,color:'var(--c-text3)'}}>{c.symbol}</span>}
                    </td>
                    <td style={{padding:'9px 12px'}}>
                      <span style={{fontSize:12,color:'var(--c-text4)',fontFamily:'monospace'}}>{rate}</span>
                    </td>
                    <td style={{padding:'9px 12px'}}>
                      <button onClick={async function(){await onUpdateCurrency(Object.assign({},c,{is_active:!c.is_active}));onToast(c.code+(c.is_active?' deactivated':' activated'),c.is_active?'info':'success');}}
                        style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:999,fontSize:11,fontWeight:500,cursor:'pointer',
                          background:c.is_active!==false?'rgba(52,211,153,.1)':'rgba(248,113,113,.1)',
                          border:'1px solid '+(c.is_active!==false?'rgba(52,211,153,.3)':'rgba(248,113,113,.3)'),
                          color:c.is_active!==false?'#34D399':'#F87171'}}>
                        <span style={{width:5,height:5,borderRadius:'50%',background:c.is_active!==false?'#34D399':'#F87171'}}/>

                    </td>
                    <td style={{padding:'9px 12px'}}>
                      <div style={{display:'flex',gap:5}}>
                        {isEdit ? (<>

                            <Ico n="save" size={10}/>Save
                          </button>
                          <button onClick={function(){setEditId(null);setEditForm({});}} style={{background:'var(--c-bg)',border:'1px solid var(--c-border2)',borderRadius:5,padding:'4px 8px',color:'var(--c-text5)',fontSize:11.5}}>
                            Cancel
                          </button>
                        </>) : (<>
                          <button onClick={function(){setEditId(c.id);setEditForm({name:c.name,symbol:c.symbol});}}
                            style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:5,padding:'4px 7px',color:'#60A5FA',display:'flex'}}><Ico n="edit" size={11}/></button>
                          <button onClick={async function(){await onDeleteCurrency(c.id);onToast(c.code+' removed','info');}}
                            style={{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.2)',borderRadius:5,padding:'4px 7px',color:'#F87171',display:'flex'}}><Ico n="trash" size={11}/></button>
                        </>)}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* Add new currency */}
        <div style={{fontSize:12,fontWeight:600,color:'var(--c-text3)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.5px'}}>Add Currency</div>
        <div style={{display:'grid',gridTemplateColumns:'80px 1fr 70px auto',gap:8,alignItems:'flex-end'}}>
          <div>
            <label style={LBL}>Code</label>
            <input style={INP} value={nCode} onChange={function(e){setNCode(e.target.value.toUpperCase().slice(0,4));}} placeholder="MYR" maxLength={4}/>
          </div>
          <div>
            <label style={LBL}>Name</label>
            <input style={INP} value={nName} onChange={function(e){setNName(e.target.value);}} placeholder="Malaysian Ringgit" onKeyDown={function(e){if(e.key==='Enter')addCurrency();}}/>
          </div>
          <div>
            <label style={LBL}>Symbol</label>
            <input style={INP} value={nSym} onChange={function(e){setNSym(e.target.value.slice(0,5));}} placeholder="RM" maxLength={5}/>
          </div>
          <button onClick={addCurrency} style={{padding:'9px 14px',background:'rgba(245,158,11,.12)',border:'1px solid rgba(245,158,11,.25)',borderRadius:8,color:'#F59E0B',fontSize:13,display:'flex',alignItems:'center',gap:5,cursor:'pointer',whiteSpace:'nowrap'}}>
            <Ico n="plus" size={13}/> Add
          </button>
        </div>

      {/* ── Default Display Currency ── */}

        <div style={{fontSize:14,fontWeight:600,color:'var(--c-text1)',marginBottom:6,display:'flex',alignItems:'center',gap:8}}><Ico n="dollar" size={14} color="#F59E0B"/> Default Display Currency</div>
        <p style={{fontSize:12,color:'var(--c-text5)',margin:'0 0 12px'}}>Global fallback currency when a project or item has no currency selected.</p>
        <select style={Object.assign({},INP,{width:220,cursor:'pointer'})} value={currency} onChange={function(e){setCurrency(e.target.value);onToast('Default currency updated');}}>
          {activeCurs.map(function(c){return <option key={c.code} value={c.code}>{c.code} — {c.name}</option>;})}
        </select>
      </div>

      {/* ── Equipment Categories ── */}
      <div style={card}>
        <div style={{fontSize:14,fontWeight:600,color:'var(--c-text1)',marginBottom:6,display:'flex',alignItems:'center',gap:8}}><Ico n="tag" size={14} color="#34D399"/> Equipment Categories</div>
        <p style={{fontSize:12,color:'var(--c-text5)',margin:'0 0 14px'}}>Manage categories available when adding equipment.</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14}}>
          {categories.map(function(c,idx){return(<div key={c} style={{display:'flex',alignItems:'center',gap:6,background:'var(--c-bg)',border:'1px solid var(--c-border2)',borderRadius:8,padding:'5px 12px'}}>
            <span style={{width:7,height:7,borderRadius:'50%',background:CC[idx%CC.length],flexShrink:0}}/><span style={{fontSize:12.5,color:'var(--c-text3)'}}>{c}</span>
            {categories.length>2&&<button onClick={function(){onRemoveCat(c);onToast('Category removed','info');}} style={{background:'none',border:'none',color:'var(--c-text5)',display:'flex',marginLeft:2,cursor:'pointer'}}><Ico n="x" size={11}/></button>}
          </div>);})}
        </div>
        <div style={{display:'flex',gap:8}}>
          <input style={Object.assign({},INP,{flex:1})} value={newCat} placeholder="New category…" onChange={function(e){setNewCat(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')addCat();}}/>
          <button onClick={addCat} style={{padding:'9px 16px',background:'rgba(52,211,153,.12)',border:'1px solid rgba(52,211,153,.25)',borderRadius:8,color:'#34D399',fontSize:13,display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}><Ico n="plusc" size={14}/> Add</button>
        </div>
      </div>

      {/* ── Manpower Types ── */}
      <div style={Object.assign({},card,{marginBottom:0})}>
        <ManpowerTypesSettings types={manpowerTypes} onAdd={onAddMpType} onUpdate={onUpdateMpType} onDelete={onDeleteMpType} onToast={onToast}/>
      </div>
    </div>
  );
}

      theme=_th[0],setTheme=_th[1];
  function toggleTheme(){setTheme(function(t){var n=t==='dark'?'light':'dark';try{localStorage.setItem('pf-theme',n);}catch(e){}return n;});}

  /* ── Live exchange rates (free, no key required) ────────────── */
  async function fetchRates() {
    try {
      var res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
      var data = await res.json();
      if (data && data.rates) {
        setRates(data.rates);
        setRatesUpdated(new Date().toLocaleTimeString());
      }
    } catch(e) { console.warn('Exchange rate fetch failed:', e.message); }
  }
  useEffect(function(){ fetchRates(); },[]);

    var id=Date.now()+Math.random();
    setToasts(function(p){return p.concat([{id:id,message:msg,type:type||'success'}]);});

  },[]);

  /* Auth setup */
  useEffect(function(){
    if(DEMO||!db){setAuthLoading(false);return;}
    db.auth.getSession().then(function(r){
      setUser(r.data&&r.data.session?r.data.session.user:null);
      setAuthLoading(false);
    });
    var listener=db.auth.onAuthStateChange(function(event,session){setUser(session?session.user:null);});
    return function(){if(listener&&listener.data&&listener.data.subscription)listener.data.subscription.unsubscribe();};
  },[]);

  /* Load data after auth */
  useEffect(function(){
    if(DEMO||!db||!user)return;

      db.from('projects').select('*').order('created_at'),
      db.from('items').select('*').order('created_at'),
      db.from('categories').select('*').order('name'),

      db.from('manpower_entries').select('*').order('created_at'),

  /* Project CRUD */
  async function saveProject(data){
    if(DEMO||!db){
      if(data.id){
        setProjects(function(p){return p.map(function(j){return j.id===data.id?Object.assign({},j,data):j;});});
        toast('Project updated');
      } else {
        setProjects(function(p){return p.concat([Object.assign({},data,{id:uid(),created_at:new Date().toISOString()})]);});
        toast('Project created');
      }
    } else {
      /* Strip fields Supabase won't allow in update/insert payload */
      var payload = {
        name:             data.name,
        description:      data.description,
        budget:           data.budget,
        color:            data.color,
        currency:         data.currency || 'USD',
        manpower_budget:  data.manpower_budget || 0,
      };
      if(data.id){
        var r = await db.from('projects').update(payload).eq('id',data.id).select().single();
        if(r.error) { toast('Save failed: '+r.error.message,'error'); return; }
        setProjects(function(p){return p.map(function(j){return j.id===data.id?r.data:j;});});
        toast('Project updated');
      } else {
        var r2 = await db.from('projects').insert(payload).select().single();
        if(r2.error) { toast('Save failed: '+r2.error.message,'error'); return; }
        setProjects(function(p){return p.concat([r2.data]);});
        toast('Project created');
      }
    }
    setShowProj(false); setEditProj(null);
  }
  async function deleteProject(id){
    if(!DEMO&&db)await db.from('projects').delete().eq('id',id);
    setProjects(function(p){return p.filter(function(j){return j.id!==id;});});
    setItems(function(i){return i.filter(function(x){return x.projectId!==id;});});
    setManpower(function(m){return m.filter(function(x){return x.projectId!==id;});});
    if(pid===id)setPid(null);toast('Project deleted','info');
  }

  /* Item CRUD */
  async function saveItem(data){
    if(DEMO||!db){
      if(data.id){
        setItems(function(p){return p.map(function(i){return i.id===data.id?Object.assign({},i,data):i;});});
        toast('Equipment updated');
      } else {
        setItems(function(p){return p.concat([Object.assign({},data,{id:uid()})]);});
        toast('Equipment added');
      }
      setShowItem(false); setEditItem(null);
      return;
    }
    /* Live Supabase — throw on error so ItemModal catch block shows it */

      setItems(function(p){return p.map(function(i){return i.id===data.id?toApp(r.data):i;});});
      toast('Equipment updated');
    } else {
      var d2 = Object.assign({},row); delete d2.id;
      var r2 = await db.from('items').insert(d2).select().single();

      setItems(function(p){return p.concat([toApp(r2.data)]);});
      toast('Equipment added');

    setShowItem(false); setEditItem(null);
  }
  async function deleteItem(id){if(!DEMO&&db)await db.from('items').delete().eq('id',id);setItems(function(p){return p.filter(function(i){return i.id!==id;});});toast('Equipment removed','info');}

  /* Manpower CRUD */
  async function saveManpower(data) {
    var payload = {
      description:   data.description,
      manpower_type: data.manpower_type,
      qty:           data.qty,
      start_date:    data.start_date || null,
      end_date:      data.end_date   || null,
      fte:           data.fte,
      est_hours:     data.est_hours,
      act_hours:     data.act_hours,
    };
    if(DEMO||!db){
      if(data.id){
        setManpower(function(p){return p.map(function(m){return m.id===data.id?Object.assign({},m,payload,{id:data.id,projectId:data.projectId}):m;});});
        toast('Manpower entry updated');
      } else {
        setManpower(function(p){return p.concat([Object.assign({},payload,{id:uid(),projectId:data.projectId})]);});
        toast('Manpower entry added');
      }
      return;
    }
    if(data.id){
      var r=await db.from('manpower_entries').update(payload).eq('id',data.id).select().single();
      if(r.error){toast('Save failed: '+r.error.message,'error');throw new Error(r.error.message);}
      setManpower(function(p){return p.map(function(m){return m.id===data.id?toAppM(r.data):m;});});
      toast('Manpower entry updated');
    } else {
      var r2=await db.from('manpower_entries').insert(Object.assign({},payload,{project_id:data.projectId})).select().single();
      if(r2.error){toast('Save failed: '+r2.error.message,'error');throw new Error(r2.error.message);}
      setManpower(function(p){return p.concat([toAppM(r2.data)]);});
      toast('Manpower entry added');
    }
  }
  async function deleteManpower(id){
    if(!DEMO&&db){
      var r=await db.from('manpower_entries').delete().eq('id',id);
      if(r.error){toast('Delete failed: '+r.error.message,'error');return;}
    }
    setManpower(function(p){return p.filter(function(m){return m.id!==id;});});
    toast('Manpower entry removed','info');
  }

  /* ── User CRUD ────────────────────────────────────────────── */
  async function addUser(form) {
    if(DEMO||!db){
      /* Demo mode: just add to local state */
      var nu={id:uid(),email:form.email,full_name:form.full_name||'',role:form.role||'Member',
        avatar_color:form.avatar_color||'#3B82F6',department:form.department||'',phone:'',
        is_active:true,created_at:new Date().toISOString()};
      setUsers(function(p){return p.concat([nu]);});
      toast('User added (demo — not saved to database)','info');
      return;
    }
    /* Live: create auth user via signUp, then update profile */
    var r=await db.auth.signUp({email:form.email.trim(),password:form.password});
    if(r.error) throw new Error(r.error.message);
    /* Wait a moment for trigger to create profile row */
    await new Promise(function(res){setTimeout(res,800);});
    var uid2=r.data&&r.data.user&&r.data.user.id;
    if(uid2){
      await db.from('profiles').update({
        full_name:form.full_name||'',role:form.role||'viewer',
        avatar_color:form.avatar_color||'#3B82F6',department:form.department||'',is_active:true
      }).eq('id',uid2);
      var fresh=await db.from('profiles').select('*').eq('id',uid2).single();
      if(fresh.data) setUsers(function(p){return p.concat([fresh.data]);});
    }
    toast('User created');
  }

        {/* Demo banner */}
        {DEMO&&(
          <div className="demo-banner" style={{background:'rgba(245,158,11,.08)',borderBottom:'1px solid rgba(245,158,11,.2)',padding:'7px 16px',display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#F59E0B',flexShrink:0}}>
            <Ico n="alert" size={13}/>
            <span><strong>Demo Mode</strong> — Replace <code style={{background:'rgba(245,158,11,.12)',padding:'1px 5px',borderRadius:4}}>YOUR_SUPABASE_URL</code> and <code style={{background:'rgba(245,158,11,.12)',padding:'1px 5px',borderRadius:4}}>YOUR_SUPABASE_ANON_KEY</code> to enable persistence.</span>
          </div>
        )}

        {/* Page body */}
        <main className="main-scroll page-pad" style={{flex:1,overflowY:'auto',padding:'20px 24px',WebkitOverflowScrolling:'touch'}}>
          {dataLoading&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:200,gap:10,color:'var(--c-text5)',fontSize:13}}><div style={{width:20,height:20,border:'2px solid var(--c-border)',borderTop:'2px solid #F59E0B',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>Loading…</div>}
          {!dataLoading&&tab==='dashboard'&&<Dashboard projects={projects} items={items} currency={currency} manpower={manpower} manpowerTypes={manpowerTypes}/>}
          {!dataLoading&&tab==='projects'&&!pid&&<ProjectsList projects={projects} items={items} currency={currency} rates={rates} manpower={manpower} manpowerTypes={manpowerTypes} onSelect={function(id){setPid(id);}} onEdit={function(p){setEditProj(p);setShowProj(true);}} onDelete={deleteProject}/>}
          {!dataLoading&&tab==='projects'&&pid&&selProj&&<Kanban project={selProj} items={items} categories={categories} currency={selProj.currency||currency} rates={rates} manpower={manpower} manpowerTypes={manpowerTypes} onAddManpower={saveManpower} onEditManpower={saveManpower} onDeleteManpower={deleteManpower} onBack={function(){setPid(null);}} onAdd={function(s){setDefStage(s);setEditItem(null);setShowItem(true);}} onEdit={function(item){setEditItem(item);setShowItem(true);}} onDelete={deleteItem} onMove={moveItem}/>}
          {tab==='team'&&<TeamView users={users} currentUser={user} onAdd={function(){setShowAddUser(true);}} onUpdate={updateUser} onDelete={deleteUser} onReset={resetPassword} onToggleActive={toggleActive} onToast={toast}/>}
          {tab==='settings'&&<SettingsView currency={currency} setCurrency={setCurrency} currencies={currencies} onAddCurrency={addCurrency} onUpdateCurrency={updateCurrency} onDeleteCurrency={deleteCurrency} categories={categories} onAddCat={addCat} onRemoveCat={removeCat} rates={rates} ratesUpdated={ratesUpdated} onRefreshRates={fetchRates} manpowerTypes={manpowerTypes} onAddMpType={addManpowerType} onUpdateMpType={updateManpowerType} onDeleteMpType={deleteManpowerType} onToast={toast}/>}
        </main>
      </div>

      {/* ── Mobile bottom nav ───────────────────────────────────── */}
      <nav className="bottom-nav" style={{display:'none',background:'var(--c-sidebar)',borderTop:'1px solid var(--c-border)',padding:'4px 0'}}>
        {NAV.map(function(n){
          var act=tab===n.id;
          return(
            <button key={n.id} className="nav-btn" onClick={function(){setTab(n.id);if(n.id!=='projects')setPid(null);}}
              style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,padding:'6px 4px',background:'none',border:'none',color:act?'#F59E0B':'var(--c-text5)',minHeight:48}}>
              <Ico n={n.icon} size={22} style={{color:act?'#F59E0B':'var(--c-text5)'}}/>
              <span style={{fontSize:10,fontWeight:act?700:400,letterSpacing:'.2px'}}>{n.label}</span>
              {act&&<div style={{position:'absolute',top:0,left:'50%',transform:'translateX(-50%)',width:28,height:2.5,background:'#F59E0B',borderRadius:'0 0 2px 2px'}}/>}
            </button>
          );
        })}
      </nav>

      {/* ── Modals ─────────────────────────────────────────────── */}
      {showProj&&<ProjectModal project={editProj} currencies={currencies} onSave={saveProject} onClose={function(){setShowProj(false);setEditProj(null);}}/>}
      {showItem&&<ItemModal item={editItem} projectId={pid} categories={categories} currencies={currencies} currency={selProj?selProj.currency||currency:currency} rates={rates} defStage={defStage} onSave={saveItem} onClose={function(){setShowItem(false);setEditItem(null);}}/>}
      {showAddUser&&<AddUserModal onSave={async function(form){await addUser(form);setShowAddUser(false);}} onClose={function(){setShowAddUser(false);}}/>}

      {/* ── Toasts ─────────────────────────────────────────────── */}
      <div style={{position:'fixed',bottom:isMobile?'calc(72px + env(safe-area-inset-bottom, 0px))':'20px',right:isMobile?'12px':'20px',left:isMobile?'12px':'auto',display:'flex',flexDirection:'column',gap:8,zIndex:2000}}>
        {toasts.map(function(t){return <Toast key={t.id} message={t.message} type={t.type} onClose={function(){setToasts(function(p){return p.filter(function(x){return x.id!==t.id;});});}}/>;} )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
