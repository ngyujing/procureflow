/* ─── SVG Bar Chart ─────────────────────────────────────────── */
function BarChart({data,h=200,currency}){
  if(!data||!data.length) return <div style={{height:h,display:'flex',alignItems:'center',justifyContent:'center',color:'#334155',fontSize:12}}>No data</div>;
  const max=Math.max(...data.map(d=>d.spend),1);
  const PL=44,PR=6,PT=10,PB=36;
  const VW=360,VH=h;
  const cW=VW-PL-PR,cH=VH-PT-PB;
  const bW=Math.min(36,Math.max(8,cW/data.length-12));
  const sp=(cW-data.length*bW)/(data.length+1);
  return (
    <svg viewBox={'0 0 '+VW+' '+VH} style={{width:'100%',height:h}}>
      {[0,.5,1].map(f=>{
        const y=PT+cH-f*cH;
        const v=f*max;
        return <g key={f}>
          <line x1={PL} y1={y} x2={VW-PR} y2={y} stroke="#1E293B" strokeWidth="1"/>
          <text x={PL-4} y={y+4} textAnchor="end" fill="#475569" fontSize="9">
            {v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v.toFixed(0)}
          </text>
        </g>;
      })}
      {data.map((d,i)=>{
        const bH=Math.max(3,(d.spend/max)*cH);
        const x=PL+sp+i*(bW+sp);
        const y=PT+cH-bH;
        const lbl=d.name.length>9?d.name.slice(0,8)+'…':d.name;
        return <g key={i}>
          <rect x={x} y={y} width={bW} height={bH} fill={d.color} rx="3" opacity=".85"/>
          <text x={x+bW/2} y={VH-PB+14} textAnchor="middle" fill="#475569" fontSize="9.5">{lbl}</text>
        </g>;
      })}
    </svg>
  );
}

    </div>

}

/* ─── Pipeline dots ─────────────────────────────────────────── */
function PipeDots({stage}){
  const idx=STAGES.indexOf(stage);
  return(
    <div style={{display:'flex',alignItems:'center'}}>
      {STAGES.map((s,i)=>{
        const done=i<idx,act=i===idx,cfg=SC[s];
        return(
          <Fragment key={s}>
            <div style={{width:8,height:8,borderRadius:'50%',flexShrink:0,
              background:(act||done)?cfg.color:'#334155',
              opacity:done?.5:act?1:.3,
              border:act?'2px solid '+cfg.color:'none'}}/>
            {i<STAGES.length-1&&<div style={{width:12,height:2,background:done?SC[STAGES[i+1]].color:'#334155',opacity:done?.45:.2}}/>}
          </Fragment>
        );
      })}
    </div>
  );
}

/* ─── Project Modal ─────────────────────────────────────────── */
function ProjectModal({project,onSave,onClose}){
  const[form,setForm]=useState(project||{name:'',description:'',budget:'',color:PC[0]});
  const[err,setErr]=useState('');
  const[saving,setSaving]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const submit=async()=>{
    if(!form.name.trim())return setErr('Project name is required.');
    if(!form.budget||isNaN(+form.budget)||+form.budget<=0)return setErr('A valid budget is required.');
    setErr('');setSaving(true);
    await onSave({...form,budget:+form.budget,id:project&&project.id});
    setSaving(false);
  };
  return(
    <Modal title={project?'Edit Project':'Create New Project'} onClose={onClose} w={460}
      footer={<>
        <button onClick={onClose} style={{padding:'8px 18px',background:'transparent',border:'1px solid #334155',borderRadius:8,color:'#94A3B8',fontSize:13}}>Cancel</button>
        <button onClick={submit} disabled={saving} style={{padding:'8px 20px',background:'#F59E0B',border:'none',borderRadius:8,color:'#000',fontSize:13,fontWeight:700,display:'flex',alignItems:'center',gap:6}}>
          <ISave s={13}/>{saving?'Saving…':project?'Save Changes':'Create Project'}
        </button>
      </>}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div><label style={LBL}>Project Name *</label><input style={INP} value={form.name} onChange={e=>set('name',e.target.value)} placeholder="e.g. IT Infrastructure Upgrade"/></div>
        <div><label style={LBL}>Description</label><input style={INP} value={form.description} onChange={e=>set('description',e.target.value)} placeholder="Brief description…"/></div>
        <div><label style={LBL}>Budget (USD) *</label><input style={INP} type="number" min="0" value={form.budget} onChange={e=>set('budget',e.target.value)} placeholder="0"/></div>

  const submit=async()=>{
    if(!form.name.trim())return setErr('Item name is required.');
    if(!form.vendor.trim())return setErr('Vendor is required.');
    if(!form.cost||isNaN(+form.cost)||+form.cost<=0)return setErr('Valid cost is required.');

    <Modal title={item?'Edit Equipment':'Add Equipment'} onClose={onClose}

/* ─── Dashboard ─────────────────────────────────────────────── */
function Dashboard({projects,items,currency}){
  const tBudget=projects.reduce((s,p)=>s+p.budget,0);
  const tSpend=items.reduce((s,i)=>s+i.cost,0);
  const deliv=items.filter(i=>i.status==='Delivered').length;
  const pct=tBudget?Math.min(100,Math.round((tSpend/tBudget)*100)):0;
  const barCol=pct>85?'#EF4444':pct>65?'#F59E0B':'#34D399';

  const chartData=useMemo(()=>projects.map(p=>({
    name:p.name.split(' ').slice(0,2).join(' '),
    spend:items.filter(i=>i.projectId===p.id).reduce((s,i)=>s+i.cost,0),
    color:p.color
  })),[projects,items]);

  const stageRows=STAGES.map(s=>({name:s,count:items.filter(i=>i.status===s).length}));

  return(
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      {/* Stat cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        {[
          [IDollar,'Total Budget',   fmt(tBudget,currency),`${projects.length} projects`,                                          '#F59E0B'],
          [ITrend, 'Total Spend',    fmt(tSpend,currency), `${pct}% utilized`,                                                    '#3B82F6'],
          [IBox,   'Total Items',    items.length,          `${deliv} delivered`,                                                   '#A78BFA'],
          [IOk,    'Completion',     (items.length?Math.round((deliv/items.length)*100):0)+'%',`${deliv} of ${items.length} items`,'#34D399'],
        ].map(([Icon,label,value,sub,color])=>(
          <div key={label} style={{background:'#1E293B',borderRadius:12,border:'1px solid #1E3A5F',padding:'18px 20px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:10.5,color:'#64748B',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px'}}>{label}</span>
              <div style={{width:28,height:28,borderRadius:7,background:color+'18',display:'flex',alignItems:'center',justifyContent:'center'}}>
                <Icon s={13} c={{color}}/>
              </div>
            </div>
            <div style={{fontSize:24,fontWeight:700,color:'#F1F5F9',lineHeight:1}}>{value}</div>
            <div style={{fontSize:11,color:'#475569',marginTop:5}}>{sub}</div>
          </div>
        ))}
      </div>

      {/* Budget bar */}
      <div style={{background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:12,padding:'16px 22px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:10}}>
          <div>
            <div style={{fontSize:11,color:'#64748B',fontWeight:600,textTransform:'uppercase',letterSpacing:'.6px',marginBottom:4}}>Budget Utilization</div>
            <div style={{fontSize:13.5,color:'#94A3B8'}}>{fmt(tSpend,currency)} <span style={{color:'#475569'}}>of {fmt(tBudget,currency)}</span></div>
          </div>
          <span style={{fontSize:24,fontWeight:700,color:barCol}}>{pct}%</span>
        </div>
        <div style={{height:8,background:'#0F172A',borderRadius:999,overflow:'hidden'}}>
          <div style={{height:'100%',borderRadius:999,width:pct+'%',background:'linear-gradient(90deg,'+barCol+'cc,'+barCol+')',transition:'width .5s'}}/>
        </div>
      </div>

      {/* Charts row */}
      <div style={{display:'grid',gridTemplateColumns:'1.4fr 1fr',gap:14}}>
        <div style={{background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:12,padding:'18px 20px'}}>
          <div style={{fontSize:13,fontWeight:600,color:'#E2E8F0',marginBottom:14}}>Spend by Project</div>
          <BarChart data={chartData} h={200} currency={currency}/>
        </div>
        <div style={{background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:12,padding:'18px 20px',display:'flex',flexDirection:'column'}}>
          <div style={{fontSize:13,fontWeight:600,color:'#E2E8F0',marginBottom:14}}>Pipeline Overview</div>
          <div style={{display:'flex',flexDirection:'column',gap:12,flex:1}}>
            {stageRows.map(({name,count})=>{
              const cfg=SC[name],p=items.length?Math.round((count/items.length)*100):0;
              return(
                <div key={name}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                    <span style={{fontSize:12,color:cfg.color}}>{name}</span>
                    <span style={{fontSize:12,color:'#475569'}}>{count} items ({p}%)</span>
                  </div>
                  <div style={{height:5,background:'#0F172A',borderRadius:999}}>
                    <div style={{height:'100%',borderRadius:999,width:p+'%',background:cfg.color,opacity:.7}}/>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{marginTop:16,paddingTop:14,borderTop:'1px solid #334155'}}>
            <div style={{fontSize:10.5,color:'#475569',textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>Overall Delivery Rate</div>
            <div style={{fontSize:22,fontWeight:700,color:'#34D399'}}>{items.length?Math.round((deliv/items.length)*100):0}%</div>
          </div>
        </div>
      </div>

      {/* Project summary */}
      <div style={{background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:12,padding:'18px 20px'}}>
        <div style={{fontSize:13,fontWeight:600,color:'#E2E8F0',marginBottom:14}}>Project Summary</div>
        {projects.length===0&&<div style={{fontSize:13,color:'#475569',textAlign:'center',padding:'20px 0'}}>No projects yet.</div>}
        {projects.map((p,idx)=>{
          const pi=items.filter(i=>i.projectId===p.id);
          const ps=pi.reduce((s,i)=>s+i.cost,0);
          const pp=p.budget?Math.min(100,Math.round((ps/p.budget)*100)):0;
          const pd=pi.filter(i=>i.status==='Delivered').length;
          return(
            <div key={p.id} style={{display:'flex',alignItems:'center',gap:14,padding:'10px 0',borderBottom:idx<projects.length-1?'1px solid #1E3A5F':'none'}}>
              <div style={{width:9,height:9,borderRadius:'50%',background:p.color,flexShrink:0}}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,color:'#E2E8F0',fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:5}}>{p.name}</div>
                <div style={{height:3,background:'#0F172A',borderRadius:999}}><div style={{height:'100%',borderRadius:999,width:pp+'%',background:p.color}}/></div>
              </div>
              <div style={{textAlign:'right',flexShrink:0}}>
                <div style={{fontSize:12.5,fontWeight:600,color:'#E2E8F0'}}>{fmt(ps,currency)}</div>
                <div style={{fontSize:11,color:'#475569'}}>{pd}/{pi.length} delivered</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─── Projects List ─────────────────────────────────────────── */
function ProjectsList({projects,items,currency,onSelect,onEdit,onDelete}){
  const stats=useMemo(()=>projects.map(p=>{
    const pi=items.filter(i=>i.projectId===p.id);
    const spend=pi.reduce((s,i)=>s+i.cost,0);
    return{...p,spend,pct:Math.min(100,Math.round((spend/p.budget)*100)),
      sc:STAGES.reduce((a,s)=>({...a,[s]:pi.filter(i=>i.status===s).length}),{})};
  }),[projects,items]);

  return(
    <div style={{display:'flex',flexDirection:'column',gap:18}}>
      <div style={{fontSize:12,color:'#475569'}}>{projects.length} project{projects.length!==1?'s':''} · {items.length} equipment items total</div>
      {projects.length===0&&<div style={{background:'#1E293B',border:'1px dashed #334155',borderRadius:14,padding:'50px 20px',textAlign:'center',color:'#475569',fontSize:13}}>No projects yet. Click <strong style={{color:'#F59E0B'}}>New Project</strong> to get started.</div>}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:14}}>
        {stats.map(p=>(
          <div key={p.id} style={{background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:14,overflow:'hidden',transition:'border-color .15s'}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=p.color+'55'}
            onMouseLeave={e=>e.currentTarget.style.borderColor='#1E3A5F'}>
            <div style={{height:3,background:p.color}}/>
            <div style={{padding:'16px 16px 14px'}}>
              <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
                <div style={{flex:1,minWidth:0,marginRight:10}}>
                  <div style={{fontSize:14,fontWeight:700,color:'#F1F5F9',marginBottom:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                  <div style={{fontSize:11.5,color:'#475569',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.description||'No description'}</div>
                </div>
                <div style={{display:'flex',gap:5,flexShrink:0}}>
                  <button onClick={e=>{e.stopPropagation();onEdit(p);}} style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:6,padding:'4px 7px',color:'#60A5FA',display:'flex'}}><IPen s={11}/></button>
                  <button onClick={e=>{e.stopPropagation();onDelete(p.id);}} style={{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.2)',borderRadius:6,padding:'4px 7px',color:'#F87171',display:'flex'}}><ITrash s={11}/></button>
                </div>
              </div>
              <div style={{marginBottom:12}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
                  <span style={{fontSize:11,color:'#475569'}}>Budget</span>
                  <span style={{fontSize:11,color:'#94A3B8'}}>{fmt(p.spend,currency)} / {fmt(p.budget,currency)}</span>
                </div>
                <div style={{height:5,background:'#0F172A',borderRadius:999}}><div style={{height:'100%',borderRadius:999,width:p.pct+'%',background:p.pct>85?'#EF4444':p.color}}/></div>
              </div>
              <div style={{display:'flex',gap:5,marginBottom:14,flexWrap:'wrap'}}>
                {STAGES.map(s=>{
                  const cnt=p.sc[s]||0,cfg=SC[s];
                  return(
                    <div key={s} style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px',borderRadius:999,background:cfg.bg,border:'1px solid '+cfg.color+'25'}}>
                      <span style={{fontSize:9.5,fontWeight:700,color:cfg.color,textTransform:'uppercase',letterSpacing:'.4px'}}>{s}</span>
                      <span style={{fontSize:11.5,fontWeight:700,color:cfg.color}}>{cnt}</span>
                    </div>
                  );
                })}
              </div>
              <button onClick={()=>onSelect(p.id)} style={{width:'100%',padding:'9px',background:p.color+'14',border:'1px solid '+p.color+'28',borderRadius:8,color:p.color,fontSize:12.5,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
                View Equipment <IChR s={13}/>
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── Project Kanban ────────────────────────────────────────── */
function Kanban({project,items,categories,currency,onBack,onAdd,onEdit,onDelete,onMove}){
  const[search,setSearch]=useState('');
  const pi=useMemo(()=>items.filter(i=>i.projectId===project.id&&(!search||i.name.toLowerCase().includes(search.toLowerCase())||i.vendor.toLowerCase().includes(search.toLowerCase()))),[items,project.id,search]);
  const all=items.filter(i=>i.projectId===project.id);
  const spend=all.reduce((s,i)=>s+i.cost,0);
  const pct=Math.min(100,Math.round((spend/project.budget)*100));
  const deliv=all.filter(i=>i.status==='Delivered').length;

  return(
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      {/* Breadcrumb */}
      <div>
        <button onClick={onBack} style={{background:'none',border:'none',color:'#475569',fontSize:12.5,display:'flex',alignItems:'center',gap:5,padding:'0 0 10px',cursor:'pointer'}}>
          <IChL s={13}/> All Projects
        </button>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:10,height:10,borderRadius:'50%',background:project.color}}/>
            <div>
              <h2 style={{margin:0,fontSize:17,fontWeight:700,color:'#F1F5F9'}}>{project.name}</h2>
              <div style={{fontSize:12,color:'#475569'}}>{project.description}</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{position:'relative'}}>
              <ISearch s={13} c={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)',color:'#475569'}}/>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search equipment…"
                style={{paddingLeft:28,paddingRight:10,paddingTop:7,paddingBottom:7,background:'#1E293B',border:'1px solid #334155',borderRadius:7,color:'#E2E8F0',fontSize:12.5,width:180}}/>
            </div>
            <button onClick={()=>onAdd('Creation')} style={{background:'#F59E0B',border:'none',borderRadius:8,padding:'8px 14px',color:'#000',fontWeight:700,fontSize:12.5,display:'flex',alignItems:'center',gap:5}}>
              <IPlus s={13}/> Add Equipment
            </button>
          </div>
        </div>
      </div>

      {/* Mini stats */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
        {[['Budget',fmt(project.budget,currency),'Allocated'],['Spend',fmt(spend,currency),pct+'% used'],['Items',all.length,'Total'],['Delivered',(all.length?Math.round((deliv/all.length)*100):0)+'%',deliv+' of '+all.length]].map(([l,v,s])=>(
          <div key={l} style={{background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:10,padding:'12px 14px'}}>
            <div style={{fontSize:10,color:'#64748B',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px',marginBottom:4}}>{l}</div>
            <div style={{fontSize:20,fontWeight:700,color:'#F1F5F9',lineHeight:1}}>{v}</div>
            <div style={{fontSize:11,color:'#475569',marginTop:3}}>{s}</div>
          </div>
        ))}
      </div>

      {/* Budget bar */}
      <div style={{background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:10,padding:'11px 16px'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
          <span style={{fontSize:11,color:'#64748B',fontWeight:600,textTransform:'uppercase',letterSpacing:'.5px'}}>Budget Utilization</span>
          <span style={{fontSize:12,fontWeight:600,color:pct>85?'#F87171':'#94A3B8'}}>{pct}%</span>
        </div>
        <div style={{height:6,background:'#0F172A',borderRadius:999}}>
          <div style={{height:'100%',borderRadius:999,width:pct+'%',background:pct>85?'#EF4444':project.color}}/>
        </div>
      </div>

      {/* Kanban columns */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
        {STAGES.map((stage,si)=>{
          const col=pi.filter(i=>i.status===stage),cfg=SC[stage];
          return(
            <div key={stage} style={{background:'#0A1422',border:'1px solid #1E293B',borderRadius:12,display:'flex',flexDirection:'column',minHeight:280}}>
              {/* Column header */}
              <div style={{padding:'11px 12px 9px',borderBottom:'2px solid '+cfg.color+'35',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <span style={{width:7,height:7,borderRadius:'50%',background:cfg.color}}/>
                  <span style={{fontSize:11,fontWeight:700,color:cfg.color,textTransform:'uppercase',letterSpacing:'.6px'}}>{stage}</span>
                </div>
                <span style={{fontSize:11,fontWeight:700,color:cfg.color,background:cfg.bg,padding:'1px 7px',borderRadius:999}}>{col.length}</span>
              </div>

              {/* Cards */}
              <div style={{flex:1,overflowY:'auto',padding:8}}>
                {col.length===0
                  ?<div style={{textAlign:'center',padding:'22px 8px',color:'#334155',fontSize:12,border:'1px dashed #1E3A5F',borderRadius:8,marginTop:4}}>No items</div>
                  :col.map(item=>(
                    <div key={item.id} style={{background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:10,padding:'11px 11px 9px',marginBottom:8}}>
                      <div style={{fontSize:12.5,fontWeight:600,color:'#E2E8F0',marginBottom:3,lineHeight:1.35}}>{item.name}</div>
                      <div style={{fontSize:11,color:'#475569',marginBottom:8}}>{item.vendor}</div>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                        <span style={{fontSize:10.5,color:'#64748B',background:'#0F172A',padding:'2px 7px',borderRadius:5}}>{item.category}</span>
                        <span style={{fontSize:12.5,fontWeight:700,color:'#E2E8F0'}}>{fmt(item.cost,currency)}</span>
                      </div>
                      {/* Stage buttons */}
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                        <div style={{display:'flex',gap:4}}>
                          {si>0&&<button onClick={()=>onMove(item.id,STAGES[si-1])} style={{background:'rgba(148,163,184,.08)',border:'1px solid #334155',borderRadius:5,padding:'3px 7px',color:'#64748B',display:'flex',alignItems:'center',gap:3,fontSize:10.5,cursor:'pointer'}}><IArrL s={10}/>{STAGES[si-1]}</button>}
                          {si<STAGES.length-1&&<button onClick={()=>onMove(item.id,STAGES[si+1])} style={{background:cfg.bg,border:'1px solid '+cfg.color+'28',borderRadius:5,padding:'3px 7px',color:cfg.color,display:'flex',alignItems:'center',gap:3,fontSize:10.5,cursor:'pointer'}}>{STAGES[si+1]}<IArrR s={10}/></button>}
                        </div>
                        <div style={{display:'flex',gap:4}}>
                          <button onClick={()=>onEdit(item)} style={{background:'rgba(96,165,250,.1)',border:'1px solid rgba(96,165,250,.2)',borderRadius:5,padding:'3px 6px',color:'#60A5FA',display:'flex',cursor:'pointer'}}><IPen s={10}/></button>
                          <button onClick={()=>onDelete(item.id)} style={{background:'rgba(248,113,113,.1)',border:'1px solid rgba(248,113,113,.2)',borderRadius:5,padding:'3px 6px',color:'#F87171',display:'flex',cursor:'pointer'}}><ITrash s={10}/></button>
                        </div>
                      </div>
                      <div style={{paddingTop:8,borderTop:'1px solid #1E3A5F',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <PipeDots stage={item.status}/>
                        <span style={{fontSize:10,color:'#475569'}}>{item.deadline}</span>
                      </div>
                    </div>
                  ))
                }
              </div>

              {/* Add shortcut */}
              <div style={{padding:8,borderTop:'1px solid #1E293B',flexShrink:0}}>
                <button onClick={()=>onAdd(stage)}
                  style={{width:'100%',padding:'6px',background:'transparent',border:'1px dashed #1E3A5F',borderRadius:7,color:'#334155',fontSize:11.5,display:'flex',alignItems:'center',justifyContent:'center',gap:4,cursor:'pointer',transition:'all .15s'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=cfg.color+'60';e.currentTarget.style.color=cfg.color;}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor='#1E3A5F';e.currentTarget.style.color='#334155';}}>
                  <IPlus s={11}/> Add here
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─── Settings ──────────────────────────────────────────────── */
function SettingsView({currency,setCurrency,categories,onAddCat,onRemoveCat,onToast}){
  const[newCat,setNewCat]=useState('');
  const card={background:'#1E293B',border:'1px solid #1E3A5F',borderRadius:12,padding:'20px 22px',marginBottom:16};
  const addCat=async()=>{
    const c=newCat.trim();
    if(!c||categories.includes(c))return;
    await onAddCat(c);setNewCat('');onToast('Category "'+c+'" added');
  };
  return(
    <div style={{maxWidth:620}}>
      <div style={card}>
        <div style={{fontSize:14,fontWeight:600,color:'#F1F5F9',marginBottom:6,display:'flex',alignItems:'center',gap:8}}>
          <IDollar s={14} c={{color:'#F59E0B'}}/> Display Currency
        </div>
        <p style={{fontSize:12,color:'#475569',margin:'0 0 12px'}}>Set the global currency used across all project budgets.</p>
        <select style={{...INP,width:180,cursor:'pointer'}} value={currency} onChange={e=>{setCurrency(e.target.value);onToast('Currency updated');}}>
          {['USD','EUR','GBP','SGD','AUD','CAD','JPY','CHF'].map(c=><option key={c}>{c}</option>)}
        </select>
      </div>
      <div style={{...card,marginBottom:0}}>
        <div style={{fontSize:14,fontWeight:600,color:'#F1F5F9',marginBottom:6,display:'flex',alignItems:'center',gap:8}}>
          <ITag s={14} c={{color:'#34D399'}}/> Equipment Categories
        </div>
        <p style={{fontSize:12,color:'#475569',margin:'0 0 14px'}}>Manage categories available when adding equipment to any project.</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:14}}>
          {categories.map((c,idx)=>(
            <div key={c} style={{display:'flex',alignItems:'center',gap:6,background:'#0F172A',border:'1px solid #334155',borderRadius:8,padding:'5px 12px'}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:CC[idx%CC.length],flexShrink:0}}/>
              <span style={{fontSize:12.5,color:'#94A3B8'}}>{c}</span>
              {categories.length>2&&<button onClick={()=>{onRemoveCat(c);onToast('Category removed','info');}} style={{background:'none',border:'none',color:'#475569',display:'flex',marginLeft:2,cursor:'pointer'}}><IX s={11}/></button>}
            </div>
          ))}
        </div>
        <div style={{display:'flex',gap:8}}>
          <input style={{...INP,flex:1}} value={newCat} placeholder="New category…" onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCat()}/>
          <button onClick={addCat} style={{padding:'9px 16px',background:'rgba(52,211,153,.12)',border:'1px solid rgba(52,211,153,.25)',borderRadius:8,color:'#34D399',fontSize:13,display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
            <IPlusC s={14}/> Add
          </button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════════════════════════ */
function App(){
  const[projects,   setProjects]  =useState(DEMO_PROJECTS);
  const[items,      setItems]     =useState(DEMO_ITEMS);
  const[categories, setCats]      =useState(DEMO_CATS);
  const[loading,    setLoading]   =useState(!DEMO);
  const[tab,        setTab]       =useState('dashboard');
  const[pid,        setPid]       =useState(null);
  const[showItem,   setShowItem]  =useState(false);
  const[showProj,   setShowProj]  =useState(false);
  const[editItem,   setEditItem]  =useState(null);
  const[editProj,   setEditProj]  =useState(null);
  const[defStage,   setDefStage]  =useState('Creation');
  const[currency,   setCurrency]  =useState('USD');
  const[toasts,     setToasts]    =useState([]);

  /* Load from Supabase if credentials are real */
  useEffect(()=>{
    if(DEMO||!db)return;
    (async()=>{
      try{
        const[{data:p,error:pe},{data:i,error:ie},{data:c,error:ce}]=await Promise.all([
          db.from('projects').select('*').order('created_at'),
          db.from('items').select('*').order('created_at'),
          db.from('categories').select('*').order('name'),
        ]);
        if(pe||ie||ce)throw pe||ie||ce;
        if(p&&p.length)setProjects(p);
        if(i&&i.length)setItems(i.map(toApp));
        if(c&&c.length)setCats(c.map(x=>x.name));
      }catch(e){console.error('Supabase load error:',e);}
      finally{setLoading(false);}
    })();
  },[]);

  /* Toast helper */
  const toast=useCallback((msg,type='success')=>{
    const id=Date.now()+Math.random();
    setToasts(p=>[...p,{id,message:msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);
  },[]);

  /* ── Project CRUD ─────────────────────────────────────────── */
  const saveProject=async data=>{
    if(DEMO||!db){
      if(data.id){setProjects(p=>p.map(j=>j.id===data.id?{...j,...data}:j));toast('Project updated');}
      else{setProjects(p=>[...p,{...data,id:uid(),created_at:new Date().toISOString()}]);toast('Project created');}
    }else{
      if(data.id){
        const{data:u}=await db.from('projects').update(data).eq('id',data.id).select().single();
        setProjects(p=>p.map(j=>j.id===data.id?u:j));toast('Project updated');
      }else{
        const{id,...rest}=data;
        const{data:u}=await db.from('projects').insert(rest).select().single();
        setProjects(p=>[...p,u]);toast('Project created');
      }
    }
    setShowProj(false);setEditProj(null);
  };
  const deleteProject=async id=>{
    if(!DEMO&&db)await db.from('projects').delete().eq('id',id);
    setProjects(p=>p.filter(j=>j.id!==id));
    setItems(i=>i.filter(x=>x.projectId!==id));
    if(pid===id)setPid(null);
    toast('Project deleted','info');
  };

  /* ── Item CRUD ────────────────────────────────────────────── */
  const saveItem=async data=>{
    if(DEMO||!db){
      if(data.id){setItems(p=>p.map(i=>i.id===data.id?{...i,...data}:i));toast('Equipment updated');}
      else{setItems(p=>[...p,{...data,id:uid(),project_id:data.projectId}]);toast('Equipment added');}
    }else{
      const row=toDB(data);
      if(data.id){
        const{data:u}=await db.from('items').update(row).eq('id',data.id).select().single();
        setItems(p=>p.map(i=>i.id===data.id?toApp(u):i));toast('Equipment updated');
      }else{
        const{id,...rest}=row;
        const{data:u}=await db.from('items').insert(rest).select().single();
        setItems(p=>[...p,toApp(u)]);toast('Equipment added');
      }
    }
    setShowItem(false);setEditItem(null);
  };
  const deleteItem=async id=>{
    if(!DEMO&&db)await db.from('items').delete().eq('id',id);
    setItems(p=>p.filter(i=>i.id!==id));toast('Equipment removed','info');
  };
  const moveItem=async(id,status)=>{
    if(!DEMO&&db)await db.from('items').update({status}).eq('id',id);
    setItems(p=>p.map(i=>i.id===id?{...i,status}:i));toast('Moved to '+status);
  };

  /* ── Category CRUD ────────────────────────────────────────── */
  const addCat=async name=>{
    if(!DEMO&&db)await db.from('categories').insert({name});
    setCats(p=>[...p,name]);
  };
  const removeCat=async name=>{
    if(!DEMO&&db)await db.from('categories').delete().eq('name',name);
    setCats(p=>p.filter(x=>x!==name));
  };

  /* Loading spinner (only when connecting to real Supabase) */
  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#0F172A',flexDirection:'column',gap:14}}>
      <div style={{width:36,height:36,border:'3px solid #1E293B',borderTop:'3px solid #F59E0B',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>
      <span style={{fontSize:13,color:'#475569'}}>Connecting to database…</span>
    </div>
  );

  const selProj=projects.find(p=>p.id===pid);
  const pageTitle=tab==='dashboard'?'Overview Dashboard':tab==='settings'?'Settings':selProj?selProj.name:'Projects';
  const pageSub=tab==='dashboard'?'Procurement performance across all projects':tab==='settings'?'Manage categories and display settings':selProj?selProj.description:'Create and manage your procurement projects';
  const NAV=[{id:'dashboard',Icon:IGrid,label:'Dashboard'},{id:'projects',Icon:IFolder,label:'Projects'},{id:'settings',Icon:IGear,label:'Settings'}];

  return(
    <div style={{display:'flex',height:'100vh',background:'#0F172A',color:'#E2E8F0',overflow:'hidden'}}>

      {/* ── Sidebar ─────────────────────────────────────────── */}
      <aside style={{width:212,minWidth:212,background:'#080F1E',borderRight:'1px solid #1E293B',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'18px 14px',borderBottom:'1px solid #1E293B'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,borderRadius:9,background:'#F59E0B',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <IBox s={16} c={{color:'#000'}}/>
            </div>
            <div>
              <div style={{fontSize:13.5,fontWeight:700,color:'#F1F5F9'}}>ProcureFlow</div>
              <div style={{fontSize:10,color:'#334155'}}>{DEMO?'Demo Mode':'Enterprise v2.1'}</div>
            </div>
          </div>
        </div>

        <nav style={{padding:'14px 10px',flex:1,overflowY:'auto'}}>
          <div style={{fontSize:9.5,color:'#334155',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',padding:'0 8px',marginBottom:8}}>Navigation</div>
          {NAV.map(({id,Icon,label})=>{
            const act=tab===id;
            return(
              <button key={id} onClick={()=>{setTab(id);if(id!=='projects')setPid(null);}}
                style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'9px 10px',borderRadius:8,border:'none',marginBottom:2,textAlign:'left',background:act?'rgba(245,158,11,.1)':'transparent',color:act?'#F59E0B':'#64748B',cursor:'pointer'}}>
                <Icon s={16}/>
                <span style={{fontSize:13,fontWeight:act?600:400}}>{label}</span>
                {act&&<span style={{marginLeft:'auto',width:5,height:5,borderRadius:'50%',background:'#F59E0B'}}/>}
              </button>
            );
          })}

          {projects.length>0&&(
            <div style={{marginTop:14,paddingTop:10,borderTop:'1px solid #1E293B'}}>
              <div style={{fontSize:9.5,color:'#334155',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',padding:'0 8px',marginBottom:8}}>Projects</div>
              {projects.map(p=>{
                const act=pid===p.id&&tab==='projects';
                return(
                  <button key={p.id} onClick={()=>{setTab('projects');setPid(p.id);}}
                    style={{width:'100%',display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:7,border:'none',marginBottom:2,textAlign:'left',background:act?p.color+'14':'transparent',color:act?p.color:'#475569',cursor:'pointer'}}>
                    <span style={{width:6,height:6,borderRadius:'50%',background:p.color,flexShrink:0}}/>
                    <span style={{fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:act?600:400}}>{p.name}</span>
                  </button>
                );
              })}
            </div>
          )}
        </nav>

        <div style={{padding:'14px 12px',borderTop:'1px solid #1E293B'}}>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <div style={{width:30,height:30,borderRadius:'50%',background:'rgba(245,158,11,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#F59E0B',flexShrink:0}}>JD</div>
            <div>
              <div style={{fontSize:12.5,fontWeight:500,color:'#E2E8F0'}}>John Doe</div>
              <div style={{fontSize:10.5,color:'#475569'}}>Procurement Lead</div>
            </div>
          </div>
        </div>
      </aside>

      {/* ── Main ──────────────────────────────────────────────── */}
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>

        {/* Demo mode banner */}
        {DEMO&&(
          <div style={{background:'rgba(245,158,11,.1)',borderBottom:'1px solid rgba(245,158,11,.2)',padding:'8px 24px',display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#F59E0B',flexShrink:0}}>
            <IWarn s={13}/>
            <span><strong>Demo mode</strong> — data is local only. Open <code style={{background:'rgba(245,158,11,.15)',padding:'1px 5px',borderRadius:4}}>index.html</code> and replace <code style={{background:'rgba(245,158,11,.15)',padding:'1px 5px',borderRadius:4}}>YOUR_SUPABASE_URL</code> / <code style={{background:'rgba(245,158,11,.15)',padding:'1px 5px',borderRadius:4}}>YOUR_SUPABASE_ANON_KEY</code> to enable persistence.</span>
          </div>
        )}

        <header style={{padding:'13px 24px',borderBottom:'1px solid #1E293B',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#0A1628',flexShrink:0}}>
          <div>
            <h1 style={{margin:0,fontSize:16,fontWeight:700,color:'#F1F5F9'}}>{pageTitle}</h1>
            <p style={{margin:0,marginTop:2,fontSize:11.5,color:'#475569'}}>{pageSub}</p>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <button style={{background:'#1E293B',border:'1px solid #334155',borderRadius:8,padding:'7px 9px',color:'#475569',display:'flex'}}><IBell s={15}/></button>
            {tab==='projects'&&!pid&&(
              <button onClick={()=>{setEditProj(null);setShowProj(true);}} style={{background:'#F59E0B',border:'none',borderRadius:8,padding:'8px 16px',color:'#000',fontWeight:700,fontSize:12.5,display:'flex',alignItems:'center',gap:6}}>
                <IPlus s={13}/> New Project
              </button>
            )}
            {tab==='projects'&&pid&&(
              <button onClick={()=>{setDefStage('Creation');setEditItem(null);setShowItem(true);}} style={{background:'#F59E0B',border:'none',borderRadius:8,padding:'8px 16px',color:'#000',fontWeight:700,fontSize:12.5,display:'flex',alignItems:'center',gap:6}}>
                <IPlus s={13}/> Add Equipment
              </button>
            )}
          </div>
        </header>

        <main style={{flex:1,overflowY:'auto',padding:'20px 24px'}}>
          {tab==='dashboard'&&<Dashboard projects={projects} items={items} currency={currency}/>}
          {tab==='projects'&&!pid&&<ProjectsList projects={projects} items={items} currency={currency} onSelect={id=>setPid(id)} onEdit={p=>{setEditProj(p);setShowProj(true);}} onDelete={deleteProject}/>}
          {tab==='projects'&&pid&&selProj&&<Kanban project={selProj} items={items} categories={categories} currency={currency} onBack={()=>setPid(null)} onAdd={stage=>{setDefStage(stage);setEditItem(null);setShowItem(true);}} onEdit={item=>{setEditItem(item);setShowItem(true);}} onDelete={deleteItem} onMove={moveItem}/>}
          {tab==='settings'&&<SettingsView currency={currency} setCurrency={setCurrency} categories={categories} onAddCat={addCat} onRemoveCat={removeCat} onToast={toast}/>}
        </main>
      </div>

      {/* ── Modals ────────────────────────────────────────────── */}
      {showProj&&<ProjectModal project={editProj} onSave={saveProject} onClose={()=>{setShowProj(false);setEditProj(null);}}/>}
      {showItem&&<ItemModal item={editItem} projectId={pid} categories={categories} currency={currency} defStage={defStage} onSave={saveItem} onClose={()=>{setShowItem(false);setEditItem(null);}}/>}

      {/* ── Toasts ────────────────────────────────────────────── */}
      <div style={{position:'fixed',bottom:20,right:20,display:'flex',flexDirection:'column',gap:8,zIndex:2000}}>
        {toasts.map(t=><Toast key={t.id} {...t} onClose={()=>setToasts(p=>p.filter(x=>x.id!==t.id))}/>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
