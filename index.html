function fmt(v, cur) {

function toApp(r) { return r ? Object.assign({}, r, {projectId: r.project_id}) : null; }

function uid()    { return 'id_' + Math.random().toString(36).slice(2) + Date.now(); }
function initials(email, name) {
  if (name && name.trim()) {
    var parts = name.trim().split(' ');
    return parts.length > 1 ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase() : parts[0].slice(0,2).toUpperCase();
  }
  return email ? email[0].toUpperCase() : '?';
}

function Ico(props) {
  var n = props.n, size = props.size || 16, color = props.color, style = props.style || {};
  var s = Object.assign({flexShrink:0, display:'block'}, style);
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color || 'currentColor'} strokeWidth="1.75"
      strokeLinecap="round" strokeLinejoin="round" style={s}
      dangerouslySetInnerHTML={{__html: SVGP[n] || ''}}/>
  );
}

/* ── Bar chart ──────────────────────────────────────────────── */
function BarChart(props) {
  var data = props.data, h = props.height || 200, currency = props.currency;
  if (!data || !data.length) return <div style={{height:h,display:'flex',alignItems:'center',justifyContent:'center',color:'#334155',fontSize:12}}>No data yet</div>;
  var maxV = 1;
  for (var k=0;k<data.length;k++) if(data[k].spend>maxV) maxV=data[k].spend;
  var PL=44,PR=8,PT=10,PB=40,VW=380,VH=h;
  var cW=VW-PL-PR, cH=VH-PT-PB;
  var bW=Math.min(38,Math.max(8,cW/data.length-14));
  var gap=(cW-data.length*bW)/(data.length+1);
  var gridEls=[0,.5,1].map(function(f){
    var y=PT+cH-f*cH, v=f*maxV;
    return <g key={'g'+f}><line x1={PL} y1={y} x2={VW-PR} y2={y} stroke="#1E293B" strokeWidth="1"/><text x={PL-4} y={y+4} textAnchor="end" fill="#475569" fontSize="9">{v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v.toFixed(0)}</text></g>;
  });
  var barEls=data.map(function(d,i){
    var bH=Math.max(3,(d.spend/maxV)*cH), x=PL+gap+i*(bW+gap), y=PT+cH-bH;
    var lbl=d.name.length>9?d.name.slice(0,8)+'…':d.name;
    return <g key={'b'+i}><rect x={x} y={y} width={bW} height={bH} fill={d.color} rx="3" opacity="0.85"/><text x={x+bW/2} y={VH-PB+14} textAnchor="middle" fill="#475569" fontSize="9.5">{lbl}</text></g>;
  });
  return <svg viewBox={'0 0 '+VW+' '+VH} style={{width:'100%',height:h}}>{gridEls}{barEls}</svg>;
}

/* ── Pipeline dots ──────────────────────────────────────────── */
function PipeDots(props) {
  var stage=props.stage, idx=STAGES.indexOf(stage), els=[];
  for(var i=0;i<STAGES.length;i++){
    var s=STAGES[i],done=i<idx,act=i===idx,cfg=SC[s];
    els.push(<div key={'d'+i} style={{width:8,height:8,borderRadius:'50%',flexShrink:0,background:(act||done)?cfg.color:'#334155',opacity:done?.5:act?1:.3,border:act?'2px solid '+cfg.color:'none'}}/>);
    if(i<STAGES.length-1) els.push(<div key={'l'+i} style={{width:12,height:2,background:done?SC[STAGES[i+1]].color:'#334155',opacity:done?.45:.2}}/>);
  }
  return <div style={{display:'flex',alignItems:'center'}}>{els}</div>;
}

  var c={success:'#34D399',error:'#F87171',info:'#60A5FA',warning:'#FBBF24'}[props.type]||'#34D399';
  return (
    <div style={{background:'#1E293B',border:'1px solid '+c+'40',borderLeft:'3px solid '+c,borderRadius:8,padding:'10px 14px',display:'flex',alignItems:'center',gap:10,minWidth:260,animation:'toast-in .2s ease',boxShadow:'0 4px 20px rgba(0,0,0,.4)'}}>
      <Ico n="check" size={14} color={c}/>
      <span style={{fontSize:13,color:'#E2E8F0',flex:1}}>{props.message}</span>
      <button onClick={props.onClose} style={{background:'none',border:'none',color:'#475569',display:'flex',padding:2}}><Ico n="x" size={13}/></button>
    </div>
  );
}

  );
}

function LoginPage(props) {
  var _m=useState('login'),mode=_m[0],setMode=_m[1];
  var _e=useState(''),email=_e[0],setEmail=_e[1];
  var _p=useState(''),pass=_p[0],setPass=_p[1];
  var _sh=useState(false),showPass=_sh[0],setShowPass=_sh[1];
  var _ld=useState(false),loading=_ld[0],setLoading=_ld[1];
  var _er=useState(''),error=_er[0],setError=_er[1];
  var _mg=useState(''),msg=_mg[0],setMsg=_mg[1];

  async function submit() {
    if(!email.trim()||!pass.trim()){setError('Please enter your email and password.');return;}
    setError('');setMsg('');setLoading(true);
    try {
      if(mode==='login'){
        var r=await db.auth.signInWithPassword({email:email.trim(),password:pass});
        if(r.error) setError(r.error.message);
        else props.onLogin(r.data.user);

        var r2=await db.auth.signUp({email:email.trim(),password:pass});
        if(r2.error) setError(r2.error.message);
        else {setMsg('Account created! Check your email to confirm, then sign in.');setMode('login');}
      }

    setLoading(false);
  }

  return (
    <div style={{height:'100vh',background:'#0F172A',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}>

      </div>

/* ── Dashboard ──────────────────────────────────────────────── */
function Dashboard(props) {
  var projects=props.projects,items=props.items,currency=props.currency;
  var tBudget=projects.reduce(function(s,p){return s+p.budget;},0);
  var tSpend=items.reduce(function(s,i){return s+i.cost;},0);
  var deliv=items.filter(function(i){return i.status==='Delivered';}).length;
  var pct=tBudget?Math.min(100,Math.round((tSpend/tBudget)*100)):0;
  var barCol=pct>85?'#EF4444':pct>65?'#F59E0B':'#34D399';
  var chartData=useMemo(function(){return projects.map(function(p){return{name:p.name.split(' ').slice(0,2).join(' '),spend:items.filter(function(i){return i.projectId===p.id;}).reduce(function(s,i){return s+i.cost;},0),color:p.color};});},[ projects,items]);
  var stageRows=STAGES.map(function(s){return{name:s,count:items.filter(function(i){return i.status===s;}).length};});
  var cards=[
    {icon:'dollar', label:'Total Budget', value:fmt(tBudget,currency), sub:projects.length+' projects',    color:'#F59E0B'},
    {icon:'trend',  label:'Total Spend',  value:fmt(tSpend,currency),  sub:pct+'% utilized',              color:'#3B82F6'},

function SettingsView(props) {

  );
}

  var _ds=useState('Creation'),defStage=_ds[0],setDefStage=_ds[1];
  var _cu=useState('USD'),currency=_cu[0],setCurrency=_cu[1];
  var _ts=useState([]),toasts=_ts[0],setToasts=_ts[1];

  var toast=useCallback(function(msg,type){
    var id=Date.now()+Math.random();
    setToasts(function(p){return p.concat([{id:id,message:msg,type:type||'success'}]);});
    setTimeout(function(){setToasts(function(p){return p.filter(function(t){return t.id!==id;});});},3500);
  },[]);

  /* Auth setup */
  useEffect(function(){
    if(DEMO||!db){setAuthLoading(false);return;}
    db.auth.getSession().then(function(r){
      setUser(r.data&&r.data.session?r.data.session.user:null);
      setAuthLoading(false);
    });
    var listener=db.auth.onAuthStateChange(function(event,session){setUser(session?session.user:null);});
    return function(){if(listener&&listener.data&&listener.data.subscription)listener.data.subscription.unsubscribe();};
  },[]);

  /* Load data after auth */
  useEffect(function(){
    if(DEMO||!db||!user)return;
    setDataLoading(true);
    Promise.all([
      db.from('projects').select('*').order('created_at'),
      db.from('items').select('*').order('created_at'),
      db.from('categories').select('*').order('name'),
      db.from('profiles').select('*').order('created_at'),
    ]).then(function(res){
      if(!res[0].error&&res[0].data)setProjects(res[0].data);
      if(!res[1].error&&res[1].data)setItems(res[1].data.map(toApp));
      if(!res[2].error&&res[2].data&&res[2].data.length)setCats(res[2].data.map(function(x){return x.name;}));
      if(!res[3].error&&res[3].data)setUsers(res[3].data);
      setDataLoading(false);
    }).catch(function(e){console.error('Load error:',e);setDataLoading(false);});
  },[user]);

  /* Logout */
  async function handleLogout(){
    if(db)await db.auth.signOut();
    setProjects(DEMO_PROJECTS);setItems(DEMO_ITEMS);setCats(DEMO_CATS);setUsers(DEMO_USERS);
  }

  /* Project CRUD */
  async function saveProject(data){
    if(DEMO||!db){
      if(data.id){setProjects(function(p){return p.map(function(j){return j.id===data.id?Object.assign({},j,data):j;});});toast('Project updated');}
      else{setProjects(function(p){return p.concat([Object.assign({},data,{id:uid(),created_at:new Date().toISOString()})]);});toast('Project created');}
    }else{
      if(data.id){var r=await db.from('projects').update(data).eq('id',data.id).select().single();if(r.data)setProjects(function(p){return p.map(function(j){return j.id===data.id?r.data:j;});});toast('Project updated');}
      else{var d=Object.assign({},data);delete d.id;var r2=await db.from('projects').insert(d).select().single();if(r2.data)setProjects(function(p){return p.concat([r2.data]);});toast('Project created');}
    }
    setShowProj(false);setEditProj(null);
  }
  async function deleteProject(id){
    if(!DEMO&&db)await db.from('projects').delete().eq('id',id);
    setProjects(function(p){return p.filter(function(j){return j.id!==id;});});
    setItems(function(i){return i.filter(function(x){return x.projectId!==id;});});
    if(pid===id)setPid(null);toast('Project deleted','info');
  }

  /* Item CRUD */
  async function saveItem(data){
    if(DEMO||!db){
      if(data.id){setItems(function(p){return p.map(function(i){return i.id===data.id?Object.assign({},i,data):i;});});toast('Equipment updated');}
      else{setItems(function(p){return p.concat([Object.assign({},data,{id:uid()})]);});toast('Equipment added');}
    }else{
      var row=toDB(data);
      if(data.id){var r=await db.from('items').update(row).eq('id',data.id).select().single();if(r.data)setItems(function(p){return p.map(function(i){return i.id===data.id?toApp(r.data):i;});});toast('Equipment updated');}
      else{var d=Object.assign({},row);delete d.id;var r2=await db.from('items').insert(d).select().single();if(r2.data)setItems(function(p){return p.concat([toApp(r2.data)]);});toast('Equipment added');}
    }
    setShowItem(false);setEditItem(null);
  }
  async function deleteItem(id){if(!DEMO&&db)await db.from('items').delete().eq('id',id);setItems(function(p){return p.filter(function(i){return i.id!==id;});});toast('Equipment removed','info');}
  async function moveItem(id,status){if(!DEMO&&db)await db.from('items').update({status:status}).eq('id',id);setItems(function(p){return p.map(function(i){return i.id===id?Object.assign({},i,{status:status}):i;});});toast('Moved to '+status);}

  /* Category CRUD */
  async function addCat(name){if(!DEMO&&db)await db.from('categories').insert({name:name});setCats(function(p){return p.concat([name]);});}
  async function removeCat(name){if(!DEMO&&db)await db.from('categories').delete().eq('name',name);setCats(function(p){return p.filter(function(x){return x!==name;});});}

  /* User update */
  async function updateUser(data){
    if(!DEMO&&db){
      await db.from('profiles').update({full_name:data.full_name, role:data.role}).eq('id',data.id);
    }
    setUsers(function(p){return p.map(function(u){return u.id===data.id?Object.assign({},u,data):u;});});
  }

  /* Loading / auth gates */
  if(authLoading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#0F172A',flexDirection:'column',gap:14}}>
      <div style={{width:36,height:36,border:'3px solid #1E293B',borderTop:'3px solid #F59E0B',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>
      <span style={{fontSize:13,color:'#475569'}}>Connecting…</span>
    </div>
  );
  if(!DEMO&&!user)return <LoginPage onLogin={setUser}/>;

  var selProj=projects.find(function(p){return p.id===pid;});
  var pageTitles={dashboard:'Overview Dashboard',projects:selProj?selProj.name:'Projects',team:'Team Members',settings:'Settings'};
  var pageSubs={dashboard:'Procurement performance across all projects',projects:selProj?selProj.description:'Create and manage your procurement projects',team:'Manage user accounts and roles',settings:'Manage categories and display settings'};
  var NAV=[
    {id:'dashboard',icon:'dashboard',label:'Dashboard'},
    {id:'projects', icon:'folder',   label:'Projects'},
    {id:'team',     icon:'team',     label:'Team'},
    {id:'settings', icon:'settings', label:'Settings'},
  ];

  return (
    <div style={{display:'flex',height:'100vh',background:'#0F172A',overflow:'hidden'}}>

      {/* Sidebar */}
      <aside style={{width:212,minWidth:212,background:'#080F1E',borderRight:'1px solid #1E293B',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'18px 14px',borderBottom:'1px solid #1E293B'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,borderRadius:9,background:'#F59E0B',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ico n="package" size={16} color="#000"/></div>
            <div><div style={{fontSize:13.5,fontWeight:700,color:'#F1F5F9'}}>ProcureFlow</div><div style={{fontSize:10,color:'#334155'}}>{DEMO?'Demo Mode':'Enterprise v2.1'}</div></div>
          </div>
        </div>
        <nav style={{padding:'14px 10px',flex:1,overflowY:'auto'}}>
          <div style={{fontSize:9.5,color:'#334155',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',padding:'0 8px',marginBottom:8}}>Navigation</div>
          {NAV.map(function(n){
            var act=tab===n.id;
            return(<button key={n.id} onClick={function(){setTab(n.id);if(n.id!=='projects')setPid(null);}} style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'9px 10px',borderRadius:8,border:'none',marginBottom:2,textAlign:'left',background:act?'rgba(245,158,11,.1)':'transparent',color:act?'#F59E0B':'#64748B'}}>
              <Ico n={n.icon} size={16}/>
              <span style={{fontSize:13,fontWeight:act?600:400}}>{n.label}</span>
              {act&&<span style={{marginLeft:'auto',width:5,height:5,borderRadius:'50%',background:'#F59E0B'}}/>}
            </button>);
          })}
          {projects.length>0&&(
            <div style={{marginTop:14,paddingTop:10,borderTop:'1px solid #1E293B'}}>
              <div style={{fontSize:9.5,color:'#334155',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',padding:'0 8px',marginBottom:8}}>Projects</div>
              {projects.map(function(p){var act=pid===p.id&&tab==='projects';return(
                <button key={p.id} onClick={function(){setTab('projects');setPid(p.id);}} style={{width:'100%',display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:7,border:'none',marginBottom:2,textAlign:'left',background:act?p.color+'14':'transparent',color:act?p.color:'#475569'}}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:p.color,flexShrink:0}}/><span style={{fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:act?600:400}}>{p.name}</span>
                </button>
              );})}
            </div>
          )}
        </nav>
        {/* User footer */}
        <div style={{padding:'12px',borderTop:'1px solid #1E293B'}}>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <div style={{width:30,height:30,borderRadius:'50%',background:'rgba(245,158,11,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#F59E0B',flexShrink:0}}>
              {DEMO?'DM':(user&&user.email?user.email[0].toUpperCase():'?')}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:500,color:'#E2E8F0',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{DEMO?'Demo User':(user&&user.email?user.email:'User')}</div>
              <div style={{fontSize:10,color:'#475569'}}>{DEMO?'Demo Mode':'Authenticated'}</div>
            </div>
            {!DEMO&&<button onClick={handleLogout} title="Sign out" style={{background:'none',border:'none',color:'#475569',display:'flex',padding:4,flexShrink:0}}><Ico n="logout" size={14}/></button>}
          </div>
        </div>
      </aside>

      {/* Main */}
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {DEMO&&(
          <div style={{background:'rgba(245,158,11,.08)',borderBottom:'1px solid rgba(245,158,11,.2)',padding:'7px 24px',display:'flex',alignItems:'center',gap:8,fontSize:12,color:'#F59E0B',flexShrink:0}}>
            <Ico n="alert" size={13}/>
            <span><strong>Demo Mode</strong> — data is not saved. Replace <code style={{background:'rgba(245,158,11,.12)',padding:'1px 5px',borderRadius:4}}>YOUR_SUPABASE_URL</code> and <code style={{background:'rgba(245,158,11,.12)',padding:'1px 5px',borderRadius:4}}>YOUR_SUPABASE_ANON_KEY</code> in index.html to enable persistence.</span>
          </div>
        )}
        <header style={{padding:'13px 24px',borderBottom:'1px solid #1E293B',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#0A1628',flexShrink:0}}>
          <div>
            <h1 style={{margin:0,fontSize:16,fontWeight:700,color:'#F1F5F9'}}>{pageTitles[tab]||pageTitle}</h1>
            <p style={{margin:0,marginTop:2,fontSize:11.5,color:'#475569'}}>{pageSubs[tab]||''}</p>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:9}}>
            <button style={{background:'#1E293B',border:'1px solid #334155',borderRadius:8,padding:'7px 9px',color:'#475569',display:'flex'}}><Ico n="bell" size={15}/></button>
            {tab==='projects'&&!pid&&<button onClick={function(){setEditProj(null);setShowProj(true);}} style={{background:'#F59E0B',border:'none',borderRadius:8,padding:'8px 16px',color:'#000',fontWeight:700,fontSize:12.5,display:'flex',alignItems:'center',gap:6}}><Ico n="plus" size={13}/> New Project</button>}
            {tab==='projects'&&pid&&<button onClick={function(){setDefStage('Creation');setEditItem(null);setShowItem(true);}} style={{background:'#F59E0B',border:'none',borderRadius:8,padding:'8px 16px',color:'#000',fontWeight:700,fontSize:12.5,display:'flex',alignItems:'center',gap:6}}><Ico n="plus" size={13}/> Add Equipment</button>}
          </div>
        </header>
        <main style={{flex:1,overflowY:'auto',padding:'20px 24px'}}>
          {dataLoading&&<div style={{display:'flex',alignItems:'center',justifyContent:'center',height:200,gap:10,color:'#475569',fontSize:13}}><div style={{width:20,height:20,border:'2px solid #1E293B',borderTop:'2px solid #F59E0B',borderRadius:'50%',animation:'spin .7s linear infinite'}}/>Loading data…</div>}
          {!dataLoading&&tab==='dashboard'&&<Dashboard projects={projects} items={items} currency={currency}/>}
          {!dataLoading&&tab==='projects'&&!pid&&<ProjectsList projects={projects} items={items} currency={currency} onSelect={function(id){setPid(id);}} onEdit={function(p){setEditProj(p);setShowProj(true);}} onDelete={deleteProject}/>}
          {!dataLoading&&tab==='projects'&&pid&&selProj&&<Kanban project={selProj} items={items} categories={categories} currency={currency} onBack={function(){setPid(null);}} onAdd={function(s){setDefStage(s);setEditItem(null);setShowItem(true);}} onEdit={function(item){setEditItem(item);setShowItem(true);}} onDelete={deleteItem} onMove={moveItem}/>}
          {tab==='team'&&<TeamView users={users} currentUser={user} onUpdate={updateUser} onToast={toast}/>}
          {tab==='settings'&&<SettingsView currency={currency} setCurrency={setCurrency} categories={categories} onAddCat={addCat} onRemoveCat={removeCat} onToast={toast}/>}
        </main>
      </div>

      {showProj&&<ProjectModal project={editProj} onSave={saveProject} onClose={function(){setShowProj(false);setEditProj(null);}}/>}
      {showItem&&<ItemModal item={editItem} projectId={pid} categories={categories} currency={currency} defStage={defStage} onSave={saveItem} onClose={function(){setShowItem(false);setEditItem(null);}}/>}
      <div style={{position:'fixed',bottom:20,right:20,display:'flex',flexDirection:'column',gap:8,zIndex:2000}}>
        {toasts.map(function(t){return <Toast key={t.id} message={t.message} type={t.type} onClose={function(){setToasts(function(p){return p.filter(function(x){return x.id!==t.id;});});}}/>;} )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
